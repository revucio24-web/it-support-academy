fe die installierte Version: VMware → Help → About&quot;,&quot;Prüfe, ob du die aktuelle Version (26H1u1 oder neuer) hast&quot;,&quot;Überprüfe die Download-Quelle (muss support.broadcom.com sein)&quot;],&quot;losung&quot;:&quot;Neueste Version von https://support.broadcom.com downloaden und installieren&quot;,&quot;pravention&quot;:&quot;Immer die aktuelle Version vom offiziellen Broadcom-Portal verwenden\n\n**Quelle:** https://en.wikipedia.org/wiki/VMware_Workstation (abgerufen 2026-10-19)\n\n---&quot;},{&quot;titel&quot;:&quot;\&quot;Windows 11 Evaluation läuft ab\&quot;&quot;,&quot;symptom&quot;:&quot;Windows meldet \&quot;Windows ist nicht aktiviert\&quot; nach 180 Tagen&quot;,&quot;ursache&quot;:&quot;Evaluation-Laufzeit abgelaufen&quot;,&quot;diagnose_schritte&quot;:[&quot;`slmgr /xpr` in Eingabeaufforderung als Administrator ausführen&quot;,&quot;Zeigt \&quot;Windows ist dauerhaft aktiviert\&quot; oder Ablaufdatum&quot;],&quot;losung&quot;:&quot;- Option A: VM löschen und neu erstellen (Eval-ISO erneut verwenden)\n  - Option B: `slmgr /rearm` (verlängert Eval um 180 Tage, max. 5 Mal)\n  - Option C: Snapshot von \&quot;Clean-Install\&quot; wiederherstellen&quot;,&quot;pravention&quot;:&quot;Regelmäßige Snapshots erstellen, Eval-Laufzeit im Kalender notieren\n\n**Quelle:** https://learn.microsoft.com/en-us/windows-server/get-started/evaluation (abgerufen 2026-10-19)\n\n---&quot;},{&quot;titel&quot;:&quot;\&quot;VM hat keinen Internetzugang\&quot;&quot;,&quot;symptom&quot;:&quot;VM kann keine Websites auflösen oder pingen&quot;,&quot;ursache&quot;:&quot;Falscher Netzwerkadapter-Modus&quot;,&quot;diagnose_schritte&quot;:[&quot;`ipconfig` in der VM ausführen&quot;,&quot;Prüfe, ob eine IP-Adresse im NAT-Bereich (z. B. 192.168.x.x) vorhanden ist&quot;,&quot;Prüfe VMware-Einstellungen: VM → Settings → Network Adapter&quot;,&quot;Prüfe, ob \&quot;Connected\&quot; und \&quot;Connect at power on\&quot; aktiviert sind&quot;],&quot;losung&quot;:&quot;- Netzwerkadapter auf \&quot;NAT\&quot; stellen\n  - VM neu starten\n  - `ipconfig /release` und `ipconfig /renew` ausführen&quot;,&quot;pravention&quot;:&quot;Netzwerkadapter-Einstellungen vor dem ersten Start prüfen\n\n---&quot;},{&quot;titel&quot;:&quot;\&quot;Windows 11 Home kann keine VMs mit Hyper-V\&quot;&quot;,&quot;symptom&quot;:&quot;Hyper-V-Option fehlt in Windows 11 Home&quot;,&quot;ursache&quot;:&quot;Hyper-V ist nur in Pro/Enterprise/Education verfügbar&quot;,&quot;diagnose_schritte&quot;:[&quot;`winver` ausführen → Windows 11 Home bestätigt&quot;,&quot;\&quot;Windows-Features aktivieren oder deaktivieren\&quot; → Hyper-V nicht vorhanden&quot;],&quot;losung&quot;:&quot;VMware Workstation Pro verwenden (läuft auf Home, benötigt kein Hyper-V)&quot;,&quot;pravention&quot;:&quot;VMware Workstation Pro als Hypervisor für Home-Benutzer empfehlen\n\n---&quot;}],&quot;quiz&quot;:[{&quot;nummer&quot;:1,&quot;frage&quot;:&quot;Was ist der Hauptgrund, warum Windows 11 Home für IT-Training nicht ausreicht?&quot;,&quot;optionen&quot;:[&quot;Es gibt keine Eingabeaufforderung&quot;,&quot;Hyper-V, GPO-Editor und RDP-Host fehlen&quot;,&quot;Windows 11 Home kann keine VMs ausführen&quot;,&quot;Es gibt keinen Geräte-Manager&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Hyper-V, gpedit.msc und RDP-Host sind in Home nicht verfügbar.&quot;},{&quot;nummer&quot;:2,&quot;frage&quot;:&quot;Wie lange ist die Evaluation-Laufzeit von Windows 11 Enterprise?&quot;,&quot;optionen&quot;:[&quot;30 Tage&quot;,&quot;90 Tage&quot;,&quot;180 Tage&quot;,&quot;365 Tage&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;180 Tage (verlängerbar mit `slmgr /rearm`).&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Welcher Netzwerkmodi in VMware ermöglicht Internetzugang für die VM?&quot;,&quot;optionen&quot;:[&quot;Host-only&quot;,&quot;Internal&quot;,&quot;NAT&quot;,&quot;Isolated&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;NAT (Network Address Translation) teilt die Internetve &quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.coursera.org/learn/technical-support-fundamentals&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.itil.org.uk/training/itil-foundation-level-courses/itil-foundation-training&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;SLA-Definitionen nicht eingehalten&quot;,&quot;symptom&quot;:&quot;Beschwerden von Benutzern über lange Wartezeiten&quot;,&quot;ursache&quot;:&quot;Keine klare SLA-Definition oder keine SLA-Überwachung&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe, ob SLAs im Ticketsystem definiert sind&quot;,&quot;Analysiere die durchschnittliche Reaktions- und Lösungszeit der letzten 20 Tickets&quot;,&quot;Vergleiche mit den vereinbarten SLA-Werten&quot;],&quot;losung&quot;:&quot;- SLA-Regeln im Ticketsystem konfigurieren (automatische Eskalation bei Überschreitung)\n  - Wöchentliches SLA-Reporting einführen\n  - Team-Schulung zu SLA-Bedeutung&quot;,&quot;pravention&quot;:&quot;SLAs bereits bei der Einführung des Ticketsystems definieren\n\n---&quot;},{&quot;titel&quot;:&quot;Incident mit Problem verwechselt&quot;,&quot;symptom&quot;:&quot;Dasselbe Problem tritt wiederholt auf&quot;,&quot;ursache&quot;:&quot;Der Incident wurde gelöst (Workaround), aber das Problem nicht dokumentiert&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe, ob es bereits ähnliche Incidents gab (Ticket-Historie durchsuchen)&quot;,&quot;Identifiziere die gemeinsame Ursache&quot;,&quot;Erstelle ein Problem-Ticket&quot;],&quot;losung&quot;:&quot;- Problem-Ticket mit allen referenzierten Incidents erstellen\n  - Root-Cause-Analyse durchführen\n  - Workaround dokumentieren&quot;,&quot;pravention&quot;:&quot;Nach jedem Incident prüfen: \&quot;Ist das gelöst oder nur umgangen?\&quot;\n\n---&quot;},{&quot;titel&quot;:&quot;Mangelnde Dokumentation&quot;,&quot;symptom&quot;:&quot;Kollege kann übernommenes Ticket nicht bearbeiten&quot;,&quot;ursache& ne Anfrage, ein Incident ist eine Störung&quot;,&quot;Es gibt keinen Unterschied&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Incident = Symptom, Problem = Ursache.&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Was bedeutet SLA?&quot;,&quot;optionen&quot;:[&quot;System Level Agreement&quot;,&quot;Service Level Agreement&quot;,&quot;Support Level Agreement&quot;,&quot;Security Level Agreement&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Service Level Agreement.&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Wann solltest du ein Ticket eskalieren?&quot;,&quot;optionen&quot;:[&quot;Bei jedem Problem&quot;,&quot;Nur wenn der Chef es sagt&quot;,&quot;Wenn es nicht in deiner Kompetenz liegt oder die SLA-Frist erreicht ist&quot;,&quot;Niemals&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;Eskalation bei Kompetenzgrenze oder SLA-Überschreitung.&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Was ist die wichtigste Regel bei der Benutzer-Kommunikation?&quot;,&quot;optionen&quot;:[&quot;Fachjargon verwenden&quot;,&quot;Aktiv zuhören und einfache Sprache verwenden&quot;,&quot;Schnelle Lösung versprechen&quot;,&quot;E-Mails sofort beantworten&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Aktiv zuhören, einfache Sprache.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Ein Mitarbeiter aus der Buchhaltung meldet sich: \&quot;Ich habe gestern mein Passwort geändert und seitdem funktioniert Outlook nicht mehr. Ich bekomme ständig eine Aufforderung, mein Passwort einzugeben, aber wenn ich es eingebe, erscheint wieder die Fehlermeldung. Ich muss dringend E-Mails beantworten.\&quot;&quot;,&quot;aufgabe&quot;:&quot;1. Was ist die Priorität dieses Tickets?\n2. Wie gehst du bei der Diagnose vor?\n3. Wie löst du das Problem?\n4. Dokumentiere den Fall für die Wissensdatenbank.&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-1-grundlagen&quot;},{&quot;title&quot;:&quot;Modul 10: Boot- und Wiederherstellungsprobleme — WinRE, SFC, DISM, BitLocker-Recovery&quot;,&quot;level&quot;:&quot;2&quot;,&quot;module&quot;:&quot;10&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows-hardware/manufacture/desktop/windows-recovery-environment--windows-re--technical-reference?view=windows-11&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/recovery-overview&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows-hardware/manufacture/desktop/repair-a-windows-image?view=windows-11&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/answers/questions/2320913/using-system-file-checker-and-restoring-corrupted&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.comptia.org/en-us/blog/how-to-study-for-comptia-a/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;SFC und DISM in falscher Reihenfolge&quot;,&quot;symptom&quot;:&quot;SFC meldet „Windows Resource Protection found corrupt files but was unable to fix some of them\&quot; — DISM wird nicht ausgeführt&quot;,&quot;ursache&quot;:&quot;Kenntnis der Abhängigkeit zwischen SFC und DISM fehlt&quot;,&quot;diagnose_schritte&quot;:[&quot;SFC-Logfile prüfen: `findstr /c:\&quot;[SR]\&quot; %windir%\\Logs\\CBS\\CBS.log > \&quot;%userprofile%\\Desktop\\sfcdetails.txt\&quot;`&quot;,&quot;Prüfen, ob SFC Dateien nicht reparieren konnte&quot;,&quot;Prüfen, ob der Komponenten-Store beschädigt ist: `Dism /Online /Cleanup-Image /CheckHealth`&quot;],&quot;losung&quot;:&quot;- DISM ausführen: `Dism /Online /Cleanup-Image /RestoreHealth`\n  - Nach DISM-Schluss SFC erneut ausführen: `sfc /scannow`\n  - SFC und DISM können mehrmals nacheinander ausgeführt werden, um alle Fehler zu beheben[Microsoft Learn — SFC, 2026-10-19]&quot;,&quot;pravention&quot;:&quot;Immer zuerst SFC, dann DISM, dann SFC erneut — diese Reihenfolge ist am effektivsten\n\n---&quot;},{&quot;titel&quot;:&quot;Falscher Laufwerksbuchstabe in WinRE&quot;,&quot;symptom&quot;:&quot;SFC/DISM-Fehler „The system cannot find the path specified\&quot; — Windows-Laufwerk ist in WinRE nicht C:&quot;,&quot;ursache&quot;:&quot;In WinRE kann das Windows-Laufwerk einen anderen Laufwerksbuchstaben haben (oft D: oder E:)&quot;,&quot;diagnose_schritte&quot;:[&quot;In WinRE-Eingabeaufforderung: `BCDEdit` ausführen&quot;,&quot;Unter „Windows Boot Loader\&quot; den Wert neben `osdevice` notieren&quot;,&quot;Alternativ: `diskpart` → `list volume` → Windows-Partition identifizieren → `exit`[Microsoft Learn — BitLocker, 2026-10-19][Microsoft Learn — Repair, 2026-10-19]&quot;,&quot;Prüfen mit: `dir C:\\Windows` oder `dir D:\\Windows`&quot;],&quot;losung&quot;:&quot;- SFC mit korrektem Laufwerk: `sfc /scannow /offbootdir=D:\\ /offwindir=D:\\Windows`\n  - DISM mit korrektem Laufwerk: `Dism /Image:D:\\ /Cleanup-Image /RestoreHealth`[Microsoft Learn — BitLocker, 2026-10-19][Microsoft Learn — Repair, 2026-10-19]&quot;,&quot;pravention&quot;:&quot;Immer vor SFC/DISM den Laufwerksbuchstaben mit `BCDEdit` oder `diskpart` prüfen\n\n---&quot;},{&quot;titel&quot;:&quot;BitLocker-Recovery-Schlüssel verloren&quot;,&quot;symptom&quot;:&quot;User meldet „BitLocker verlangt Recovery-Schlüssel, aber ich habe ihn nicht\&quot;&quot;,&quot;ursache&quot;:&quot;Recovery-Schlüssel wurde nicht an einem sicheren Ort gespeichert oder die TPM-Konfiguration wurde geändert&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfen, ob der Schlüssel im Microsoft-Konto verfügbar ist: Benutzer auffordern, sich unter account.microsoft.com/devices/recoverykey anzumelden&quot;,&quot;In einer Domänen-Umgebung: AD-Objekt des Computers öffnen und Recovery-Schlüssel auslesen&quot;,&quot;Prüfen, ob ein Ausdruck oder eine Textdatei vorhanden ist&quot;],&quot;losung&quot;:&quot;- Wenn Schlüssel gefunden: in WinRE oder auf dem BitLocker-Bildschiff eingeben\n  - Wenn Schlüssel nicht gefunden: Datenrettung durch spezialisierte Dienstleister (teilerfolg)\n  - Letzter Ausweg: Windows zurücksetzen oder neu installieren (Datenverlust)[Microsoft Learn — Repair, 2026-10-19]&quot;,&quot;pravention&quot;:&quot;BitLocker-Recovery-Schlüssel in Active Directory sichern und/oder im Microsoft-Konto speichern; Benutzer instruieren, den Schlüssel auszudrucken\n\n---&quot;},{&quot;titel&quot;:&quot;Boot-Schleife — Startup Repair meldet „Couldn't repair your PC\&quot;&quot;,&quot;symptom&quot;:&quot;PC startet wiederholt neu, Startup Repair schlägt fehl, System Restore ist nicht verfügbar&quot;,&quot;ursache&quot;:&quot;Systemdateien oder BCD (Boot Configuration Data) sind stark beschädigt&quot;,&quot;diagnose_schritte&quot;:[&quot;WinRE öffnen: Eingabeaufforderung&quot;,&quot;BCD reparieren: `bootrec /fixmbr`, `bootrec /fixboot`, `bootrec /rebuildbcd`[CompTIA A+, 2026-10-19]&quot;,&quot;Partitionstyp prüfen: `diskpart` → `list disk` → `select disk 0` → `list partition`&quot;,&quot;Prüfen, ob EFI-Partition vorhanden und aktiv ist&quot;],&quot;losung&quot;:&quot;- BCDStore neu erstellen: `bootrec /rebuildbcd`\n  - Wenn fehlgeschlagen: BCD manuell neu erstellen mit `bcdedit`\n  - Als letzte Option: Neuinstallation mit „Benutzerdefinierte Installation\&quot; (Dateien behalten, wenn möglich)[CompTIA A+, 2026-10-19]&quot;,&quot;pravention&quot;:&quot;Regelmäßige Systemimages erstellen; Windows Updates nicht abbrechen; SSD/Gesundheit der Festplatte überwachen\n\n---&quot;}],&quot;quiz&quot;:[{&quot;nummer&quot;:1,&quot;frage&quot;:&quot;Wie lautet der Befehl, um SFC offline auf ein nicht startendes Windows-System anzuwenden?&quot;,&quot;optionen&quot;:[&quot;`sfc /scannow`&quot;,&quot;`sfc /scannow /offbootdir=D:\\ /offwindir=D:\\Windows`&quot;,&quot;`sfc /offline D:\\Windows`&quot;,&quot;`sfc /repair D:\\`&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;SFC benötigt die Parameter `/offbootdir` und `/offwindir` für die Offline-Nutzung.&quot;},{&quot;nummer&quot;:2,&quot;frage&quot;:&quot;Welches Tool repariert den Komponenten-Store (WinSxS), von dem SFC abhängig ist?&quot;,&quot;optionen&quot;:[&quot;chkdsk&quot;,&quot;bootrec&quot;,&quot;DISM&quot;,&quot;manage-bde&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;DISM (Deployment Image Servicing and Management) repariert den Komponenten-Store.&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Was tun, wenn SFC meldet, dass es Dateien nicht reparieren konnte?&quot;,&quot;optionen&quot;:[&quot;Den PC neu starten und SFC erneut ausführen&quot;,&quot;DISM ausführen und anschließend SFC erneut ausführen&quot;,&quot;Windows neu installieren&quot;,&quot;Den Fehler ignorieren&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;DISM repariert den Komponenten-Store, dann kann SFC die Systemdateien reparieren.&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Wie lang ist ein BitLocker-Recovery-Schlüssel?&quot;,&quot;optionen&quot;:[&quot;16 Zeichen&quot;,&quot;24 Zeichen&quot;,&quot;48 Ziffern&quot;,&quot;64 Zeichen&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;Der BitLocker-Recovery-Schlüssel besteht aus 48 Ziffern.&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Was ist der erste Schritt bei der Boot-Reparatur, wenn Windows nicht startet?&quot;,&quot;optionen&quot;:[&quot;Windows neu installieren&quot;,&quot;WinRE öffnen und Startup Repair ausführen&quot;,&quot;Die Festplatte formatieren&quot;,&quot;Die BIOS-Einstellungen zurücksetzen&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;WinRE → Startup Repair ist der erste Schritt, bevor manuelle Reparaturen durchführt.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Ein Mitarbeiter aus der Buchhaltung meldet sich: „Ich habe gestern ein Windows-Update installiert und seitdem startet Windows nicht mehr. Der Bildschirm zeigt 'Preparing Automatic Repair', dann geht alles wieder von vorne. Ich komme nicht auf meinen Desktop und habe dringend Dateien auf dem Laptop. Der Laptop ist mit BitLocker verschlüsselt.\&quot;&quot;,&quot;aufgabe&quot;:&quot;1. Wie gehst du bei der Diagnose vor?\n2. Wie löst du das Problem?\n3. Wie stellst du sicher, dass die Daten erhalten bleiben?&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-10-boot-recovery&quot;},{&quot;title&quot;:&quot;Modul 11: Active Directory, Gruppenrichtlinien, Benutzer- und Rechteverwaltung&quot;,&quot;level&quot;:&quot;2&quot;,&quot;module&quot;:&quot;11&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows Server 2022&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-overview&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-management-console&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/de-de/windows-server/identity/ad-ds/manage/group-policy/group-policy-processing&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/de-de/windows-server/identity/ad-ds/plan/delegating-administration-by-using-ou-objects&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/de-de/windows-server/identity/ad-ds/manage/delegation-control-wizard&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/de-de/windows-server/identity/ad-ds/plan/creating-an-organizational-unit-design&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.professormesser.com/free-a-plus-training/220-1102/220-1102-video/active-directory-220-1102/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://courseiva.com/learn/a-plus-core-2/windows-group-policy&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;GPO wird nicht angewendet — Link an falscher Stelle&quot;,&quot;symptom&quot;:&quot;Die GPO-Einstellungen erscheinen auf dem Client nicht&quot;,&quot;ursache&quot;:&quot;Die GPO wurde nicht mit der richtigen OU oder Domäne verknüpft&quot;,&quot;diagnose_schritte&quot;:[&quot;Öffne die GPMC und prüfe, ob die GPO mit der gewünschten OU verknüpft ist&quot;,&quot;Prüfe, ob der GPO-Link aktiviert ist (Link Enabled)&quot;,&quot;Prüfe mit `gpresult /r` auf dem Client, ob die GPO in der Liste der angewendeten GPOs erscheint&quot;,&quot;Prüfe, ob die richtigen Sicherheitsberechtigungen auf der GPO vorhanden sind&quot;],&quot;losung&quot;:&quot;- GPO-Link mit der richtigen OU verknüpfen (Rechtsklick auf OU → „Vorh. GPO verknüpfen\&quot;)\n  - Berechtigungen prüfen: Die Benutzer/Gruppe muss über „Lesen\&quot; und „Gruppenrichtlinie anwenden\&quot; verfügen&quot;,&quot;pravention&quot;:&quot;GPO-Verknüpfungen immer in der GPMC überprüfen, nicht nur den Link erstellen\n\n---&quot;},{&quot;titel&quot;:&quot;Block Inheritance verhindert kritische Sicherheits-GPOs&quot;,&quot;symptom&quot;:&quot;Eine auf Domänenebene konfigurierte Sicherheits-GPO wird auf bestimmte OUs nicht angewendet&quot;,&quot;ursache&quot;:&quot;Auf der OU wurde „Vererbung blockieren\&quot; aktiviert&quot;,&quot;diagnose_schritte&quot;:[&quot;Öffne die GPMC und prüfe die betroffene OU — erscheint ein blauer Ausrufezeichen?&quot;,&quot;Prüfe die GPO-Links auf der OU — welche sind aktiv?&quot;,&quot;Identifiziere die GPOs, die durch Block Inheritance blockiert werden&quot;],&quot;losung&quot;:&quot;- Block Inheritance deaktivieren (Rechtsklick auf OU → „Vererbung blockieren\&quot; deaktivieren)\n  - Alternativ: Die kritische GPO als **Enforced** markieren — Enforced überschreibt Block Inheritance&quot;,&quot;pravention&quot;:&quot;Block Inheritance nur in Ausnahmefällen verwenden; kritische Sicherheits-GPOs sollten als Enforced markiert werden\n\n---&quot;},{&quot;titel&quot;:&quot;Delegierte Rechte funktionieren nicht — falsche Berechtigungsebene&quot;,&quot;symptom&quot;:&quot;Ein Helpdesk-Mitarbeiter kann trotz Delegierung keine Passwörter zurücksetzen&quot;,&quot;ursache&quot;:&quot;Die Delegierung wurde auf der falschen OU oder mit falschen Aufgaben durchgeführt&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe in ADUC: Welche OU wurde delegiert? Enthält sie die betroffenen Benutzerobjekte?&quot;,&quot;Prüfe im Delegation of Control-Assistenten: Welche Aufgabe wurde delegiert?&quot;,&quot;Prüfe die Berechtigungen: ADUC → Ansicht → Erweiterte Funktionen → Eigenschaften der OU → Sicherheit → Erweitert&quot;,&quot;Vergewissere dich, dass die Gruppe über „Kennwort zurücksetzen\&quot; für die gewünschten Objekte verfügt&quot;],&quot;losung&quot;:&quot;- Delegierung auf der OU durchführen, die tatsächlich die Benutzer enthält\n  - Im Assistenten die korrekte Aufgabe auswählen: „Benutzerkennwörter zurücksetzen und die Kennwortänderung bei der nächsten Anmeldung erzwingen\&quot;\n  - Alternativ: Benutzer oder Gruppe zu einer Gruppe mit den entsprechenden Berechtigungen hinzufügen&quot;,&quot;pravention&quot;:&quot;Delegierungen dokumentieren und regelmäßig überprüfen; Testen mit einem Testkonto vor der Produktivschaltung\n\n---&quot;},{&quot;titel&quot;:&quot;GPO-Änderungen werden erst nach Neustart angewendet&quot;,&quot;symptom&quot;:&quot;Änderungen an einer GPO werden erst nach einem Neustart des Clients oder einer erneuten Anmeldung des Benutzers wirksam&quot;,&quot;ursache&quot;:&quot;Die GPO wurde nicht aktualisiert&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe, ob der Client die Domäne erreicht (Domänenmitgliedschaft)&quot;,&quot;Führe `gpupdate /force` aus, um die sofortige Aktualisierung zu erzwingen&quot;,&quot;Prüfe mit `gpresult /r`, ob die GPO-Liste aktuell ist&quot;,&quot;Prüfe, ob der Client SYSVOL korrekt erreicht (Netzwerkverbindung zum DC)&quot;],&quot;losung&quot;:&quot;- `gpupdate /force` ausführen (erzwingt die Aktualisierung aller GPOs)\n  - Bei Computer-Konfigurationen: Neustart ist oft erforderlich\n  - Bei Benutzer-Konfigurationen: Ab- und erneutes Anmeldung reicht in der Regel&quot;,&quot;pravention&quot;:&quot;GPO-Änderungen planen und nach der Änderung `gpupdate /force` auf den betroffenen Clients ausführen\n\n---&quot;}],&quot;quiz&quot;:[{&quot;nummer&quot;:1,&quot;frage&quot;:&quot;In welcher Reihenfolge werden GPOs verarbeitet (LSDOU)?&quot;,&quot;optionen&quot;:[&quot;Local → Site → Domain → OU&quot;,&quot;Site → Domain → OU → Local&quot;,&quot;OU → Domain → Site → Local&quot;,&quot;Domain → Site → OU → Local&quot;],&quot;antwort&quot;:0,&quot;erklaerung&quot;:&quot;Local, Site, Domain, Organizational Unit.&quot;},{&quot;nummer&quot;:2,&quot;frage&quot;:&quot;Was passiert, wenn Block Inheritance auf einer OU aktiviert ist?&quot;,&quot;optionen&quot;:[&quot;Alle GPOs werden angewendet&quot;,&quot;Die OU erbt keine GPOs von übergeordneten Containern, außer sie sind als Enforced markiert&quot;,&quot;Die OU erbt nur lokale GPOs&quot;,&quot;Block Inheritance deaktiviert alle GPOs&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Block Inheritance verhindert die Vererbung, außer die GPO ist Enforced.&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Welches Tool wird primär zur Delegierung von Verwaltungsrechten verwendet?&quot;,&quot;optionen&quot;:[&quot;gpedit.msc&quot;,&quot;Der Delegation of Control-Assistent in ADUC&quot;,&quot;regedit.exe&quot;,&quot;services.msc&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Der Delegation of Control-Assistent in „Active Directory-Benutzer und -Computer\&quot;.&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Wo wird der Group Policy Template (GPT) gespeichert?&quot;,&quot;optionen&quot;:[&quot;Nur im Active Directory&quot;,&quot;Im SYSVOL-Ordner auf jedem Domain Controller&quot;,&quot;Nur auf dem lokalen Client&quot;,&quot;In der Registry des Domain Controllers&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Der GPT liegt im SYSVOL-Ordner auf jedem Domain Controller unter `\\\\<Domäne>\\SYSVOL\\<Domäne>\\Policies\\<GPO-GUID>\\`.&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Welches Kommando erzwingt die sofortige Aktualisierung aller Gruppenrichtlinien auf dem Client?&quot;,&quot;optionen&quot;:[&quot;gpresult /r&quot;,&quot;gpupdate /force&quot;,&quot;gpedit.msc&quot;,&quot;netstat /gp&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;`gpupdate /force`.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Ein Mitarbeiter aus der Buchhaltung meldet sich: „Seit gestern kann ich mich nicht mehr anmelden. Ich bekomme die Fehlermeldung: „Das Konto ist gesperrt\&quot;. Ich muss dringend auf die Buchhaltungsdaten zugreifen, da heute Monatsabschluss ist.\&quot;&quot;,&quot;aufgabe&quot;:&quot;1. Analysiere beide Tickets und ordne sie nach Priorität zu\n2. Beschreibe die Diagnose-Schritte für das gesperrte Konto\n3. Beschreibe, wie du die Delegierung nutzen würdest, um das Passwort zurückzusetzen, ohne Domain-Admin-Rechte zu verwenden\n4. Untersuche die GPO-Problematik: Welche GPO könnte den Desktop-Hintergrund verändert haben?\n5. Dokumentiere den Fall für die Wissensdatenbank&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-11-ad-gpo&quot;},{&quot;title&quot;:&quot;Modul 12: Netzwerk Tiefe — VLAN, VPN, Firewall, DNS-Fehleranalyse&quot;,&quot;level&quot;:&quot;2&quot;,&quot;module&quot;:&quot;12&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.professormesser.com/free-a-plus-training/220-1101/220-1101-video/vlans-and-vpns-220-1101/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.netacad.com/content/srwe/1.0/courses/content/m3/en-US/assets/3.4.6-lab---configure-vlans-and-trunking.pdf&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/training/modules/manage-defender-windows-client/5-manage-windows-defender-firewall&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows-server/networking/dns/troubleshoot/troubleshoot-dns-client&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://blog.alphaprep.net/comptia-a-core-1-networking-tools-how-to-choose-the-right-tool-for-the-right-scenario/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;Falsche DNS-Server-Einstellung&quot;,&quot;symptom&quot;:&quot;Der Benutzer kann Webseiten nicht aufrufen (Name nicht auflösbar), aber `ping 8.8.8.8` funktioniert&quot;,&quot;ursache&quot;:&quot;Falsche oder nicht erreichbare DNS-Server in den Netzwerkeinstellungen&quot;,&quot;diagnose_schritte&quot;:[&quot;`ipconfig /all` — prüfe, welche DNS-Server konfiguriert sind&quot;,&quot;`ping <DNS-Server-IP>` — ist der DNS-Server erreichbar?&quot;,&quot;`nslookup www.example.com 8.8.8.8` — funktioniert DNS mit alternativ-Server?&quot;],&quot;losung&quot;:&quot;- DNS-Server in den Netzwerkeinstellungen (Systemsteuerung → Netzwerk → Adapter-Eigenschaften → IPv4) auf 8.8.8.8 und 8.8.4.4 (Google DNS) setzen\n  - Falls im Unternehmensnetzwerk: Domänen-DNS-Server vom Administrator erfragen\n  - `ipconfig /flushdns` ausführen&quot;,&quot;pravention&quot;:&quot;DNS-Server-Einstellungen bei jedem Netzwerkwechsel prüfen\n\n---&quot;},{&quot;titel&quot;:&quot;Firewall blockiert legitimen Datenverkehr&quot;,&quot;symptom&quot;:&quot;Eine Anwendung (z. B. RDP, Drucker, Datenbank) kann nicht auf den Server zugreifen — die Firewall blockiert die Verbindung&quot;,&quot;ursache&quot;:&quot;Keine Firewall-Regel für den benötigten Port oder die Anwendung&quot;,&quot;diagnose_schritte&quot;:[&quot;`ping <Server-IP>` — funktioniert die IP-Ebene?&quot;,&quot;`telnet <Server-IP> <Port>` oder `Test-NetConnection` — ist der Port erreichbar?&quot;,&quot;Windows Defender Firewall → Erweiterte Einstellungen → Eingehende Regeln prüfen&quot;,&quot;Prüfen, ob Block-Regel für den Port existiert&quot;],&quot;losung&quot;:&quot;- Systemsteuerung → Windows Defender Firewall → App oder Feature durch Firewall zulassen → Anwendung hinzufügen\n  - Oder: Erweiterte Einstellungen → Eingehende Regel → Neue Regel → Port → TCP/UDP + Portnummer → Verbindung zulassen\n  - Im Unternehmensnetzwerk: Firewall-Regel vom Netzwerkadministrator anfordern&quot;,&quot;pravention&quot;:&quot;Firewall-Regeln dokumentieren und bei Neueinstellungen der Applications prüfen\n\n---&quot;},{&quot;titel&quot;:&quot;VLAN-Fehlerkonfiguration&quot;,&quot;symptom&quot;:&quot;Gerät im Netzwerk ist mit dem Switch verbunden, erhält keine IP-Adresse oder kann nicht mit anderen Geräten kommunizieren&quot;,&quot;ursache&quot;:&quot;Switch-Port ist dem falschen VLAN zugeordnet (z. B. Port ist im VLAN 10, Gerät sollte im VLAN 20 sein)&quot;,&quot;diagnose_schritte&quot;:[&quot;Physikalische Verbindung prüfen (Link-LED am Switch-Port?)&quot;,&quot;`ipconfig` — erhält das Gerät eine IP-Adresse? (169.254.x.x = APIPA = kein DHCP)&quot;,&quot;Switch-Konfiguration prüfen: `show vlan brief` (Cisco IOS)&quot;,&quot;Prüfen, ob der Port als Access-Port konfiguriert und dem richtigen VLAN zugeordnet ist&quot;],&quot;losung&quot;:&quot;```\n  Switch(config)# interface f0/6\n  Switch(config-if)# switchport mode access\n  Switch(config-if)# switchport access vlan 20\n  Switch(config-if)# end\n  Switch# show vlan brief\n  ```&quot;,&quot;pravention&quot;:&quot;VLAN-Konfiguration und Port-Zuordnungen dokumentieren\n\n---&quot;},{&quot;titel&quot;:&quot;Veralteter DNS-Cache&quot;,&quot;symptom&quot;:&quot;Webseite wurde auf neue IP umgezogen, aber der PC zeigt weiterhin Fehler oder alte Seite&quot;,&quot;ursache&quot;:&quot;Der lokale DNS-Resolver-Cache enthält veralteten Eintrag&quot;,&quot;diagnose_schritte&quot;:[&quot;`ipconfig /displaydns` — suche nach dem Domain-Namen, prüfe die IP-Adresse&quot;,&quot;Vergleiche mit der aktuellen IP (z. B. über `nslookup www.example.com 8.8.8.8`)&quot;,&quot;Falls abweichend: Cache leeren&quot;],&quot;losung&quot;:&quot;```\n  ipconfig /flushdns\n  ```\n  Danach den Browser-Cache leeren oder im Inkognito-Modus testen.&quot;,&quot;pravention&quot;:&quot;Nach DNS-Änderungen immer `ipconfig /flushdns` ausführen\n\n---&quot;}],&quot;quiz&quot;:[{&quot;nummer&quot;:1,&quot;frage&quot;:&quot;Welcher Switch-Port-Modus wird verwendet, um einen Port einem einzelnen VLAN zuzuordnen?&quot;,&quot;optionen&quot;:[&quot;Trunk-Modus&quot;,&quot;Access-Modus&quot;,&quot;Hybrid-Modus&quot;,&quot;Routing-Modus&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Access-Modus. Ein Transport-Port wird einem einzelnen VLAN zugeordnet und verbindet Endgeräte.&quot;},{&quot;nummer&quot;:2,&quot;frage&quot;:&quot;Welcher VPN-Typ wird typischerweise für die Verbindung einer Zweigstelle mit dem Hauptquartier verwendet?&quot;,&quot;optionen&quot;:[&quot;Remote-Access-VPN&quot;,&quot;SSL-VPN&quot;,&quot;Site-to-Site-VPN&quot;,&quot;Client-VPN&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;Site-to-Site-VPN. Es verbindet zwei Netzwerke permanent und transparent für Benutzer.&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Welcher Befehl leert den DNS-Resolver-Cache in Windows?&quot;,&quot;optionen&quot;:[&quot;`ipconfig /release`&quot;,&quot;`ipconfig /flushdns`&quot;,&quot;`nslookup /clear`&quot;,&quot;`ping /flush`&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;`ipconfig /flushdns` entfernt alle zwischengespeicherten DNS-Einträge.&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Sie können eine Webseite nicht über den Domain-Namen aufrufen, aber `ping 8.8.8.8` funktioniert. Was ist die wahrscheinlichste Ursache?&quot;,&quot;optionen&quot;:[&quot;Die Firewall blockiert den Browser&quot;,&quot;Der DNS-Server ist falsch konfiguriert&quot;,&quot;Der Switch ist defekt&quot;,&quot;Das Kabel ist nicht eingesteckt&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Die IP-Verbindung funktioniert, die Namensauflösung schlägt fehl → DNS-Problem.&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Welches Windows-Firewall-Profil ist für ein öffentliches Netzwerk (z. B. Café) vorgesehen?&quot;,&quot;optionen&quot;:[&quot;Domain&quot;,&quot;Private&quot;,&quot;Public&quot;,&quot;Enterprise&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;Public. Das Public-Profil gilt für nicht vertrauenswürdige Netzwerke und hat die strengsten Firewall-Regeln.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Ein Mitarbeiter im Homeoffice meldet sich: \&quot;Ich kann seit gestern auf keine unserer internen Server zugreifen. Ich VPN mich mit Cisco AnyConnect ein, aber wenn ich den Namen des Servers eingebe, kommt sofort 'Server nicht gefunden'. Unsere Webseite www.unternehmen.de im Browser geht auch nicht.\&quot;&quot;,&quot;aufgabe&quot;:&quot;1. Was ist die Priorität dieses Tickets?\n2. Welche Diagnose-Schritte führst du durch?\n3. Welche Befehle verwendest du?\n4. Wie dokumentierst du den Fall?&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-12-netzwerk-tiefe&quot;},{&quot;title&quot;:&quot;Modul 13: PowerShell für Support-Automatisierung&quot;,&quot;level&quot;:&quot;2&quot;,&quot;module&quot;:&quot;13&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://learn.microsoft.com/de-de/powershell/scripting/overview&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/de-de/powershell/scripting/learn/ps101/00-introduction&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/de-de/powershell/module/microsoft.powershell.management/get-process&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.comptia.org/content/guides/comptia-a-plus-certification&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;PowerShell-Skript wird nicht ausgeführt&quot;,&quot;symptom&quot;:&quot;Fehlermeldung „Das Ausführen von Skripten ist auf diesem System deaktiviert\&quot;&quot;,&quot;ursache&quot;:&quot;Die Execution Policy (Ausführungsrichtlinie) blockiert die Skriptausführung&quot;,&quot;diagnose_schritte&quot;:[&quot;`Get-ExecutionPolicy` ausführen — zeigt die aktuelle Richtlinie&quot;,&quot;Prüfen, ob die Richtlinie `Restricted` ist&quot;,&quot;Den Scope prüfen: `Get-ExecutionPolicy -List`&quot;],&quot;losung&quot;:&quot;- `Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser` ausführen\n  - Danach sollte `Get-ExecutionPolicy` den Wert `RemoteSigned` zurückgeben&quot;,&quot;pravention&quot;:&quot;Execution Policy bei der Einrichtung der Testumgebung korrekt konfigurieren\n\n---&quot;},{&quot;titel&quot;:&quot;Cmdlet wird nicht erkannt&quot;,&quot;symptom&quot;:&quot;Fehlermeldung „Der Begriff 'Get-Process' wird nicht als Name eines Cmdlets erkannt\&quot;&quot;,&quot;ursache&quot;:&quot;falsche Modul-Pfad oder nicht importiertes Modul&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfen, ob das Modul vorhanden ist: `Get-Module -ListAvailable`&quot;,&quot;Prüfen, ob das Modul geladen ist: `Get-Module`&quot;,&quot;Ggf. Modul manuell importieren: `Import-Module Microsoft.PowerShell.Management`&quot;],&quot;losung&quot;:&quot;- Modul-Pfad überprüfen und ggf. PATH-Umgebungsvariable korrigieren\n  - In PowerShell 7: `Get-Module -ListAvailable` nutzen, um verfügbare Module zu finden&quot;,&quot;pravention&quot;:&quot;Module beim Anmelden automatisch laden (Profile-Skript in `$PROFILE`)\n\n---&quot;},{&quot;titel&quot;:&quot;Pipeline-Fehler bei fehlenden Eigenschaften&quot;,&quot;symptom&quot;:&quot;Leere Ausgabe oder Fehlermeldung beim Verketten von Befehlen&quot;,&quot;ursache&quot;:&quot;Eigenschaft existiert nicht oder ist `$null`; falsche Objektstruktur&quot;,&quot;diagnose_schritte&quot;:[&quot;Objekttyp prüfen: `Get-Process | Get-Member`&quot;,&quot;Verfügbare Eigenschaften anzeigen: `(Get-Process -Name \&quot;powershell\&quot;).PSObject.Properties.Name`&quot;,&quot;Prüfen, ob Eigenschaften NULL sind: `Get-Process | Select-Object Name, Id, WorkingSet`&quot;],&quot;losung&quot;:&quot;- `Select-Object` nutzen, um benötigte Eigenschaften auszuwählen\n  - `Where-Object` mit korrekten Eigenschaftsnamen verwenden\n  - Bei `$null`-Werten: `if ($null -ne $variable)` prüfen&quot;,&quot;pravention&quot;:&quot;Vor der Pipeline die Struktur des Objekts mit `Get-Member` prüfen\n\n---&quot;},{&quot;titel&quot;:&quot;Zugriffsverweigert bei Remote-Befehlen&quot;,&quot;symptom&quot;:&quot;Fehlermeldung „Zugriff verweigert\&quot; bei `Invoke-Command` oder `Enter-PSSession`&quot;,&quot;ursache&quot;:&quot;PowerShell Remoting nicht aktiviert oder fehlende Administratorrechte auf Zielcomputer&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfen, ob Remoting aktiviert: `Test-WSMan -ComputerName \&quot;PC-02\&quot;`&quot;,&quot;Prüfen, ob der aktuelle Benutzer Administrator auf dem Zielcomputer ist&quot;,&quot;Windows-Firewall-Regeln für WinRM prüfen&quot;],&quot;losung&quot;:&quot;- Auf dem Zielcomputer: `Enable-PSRemoting -Force` ausführen (als Administrator)\n  - Windows-Dienste `WinRM` starten: `Start-Service WinRM`\n  - Firewall-Ausnahme für WinRM überprüfen&quot;,&quot;pravention&quot;:&quot;Remoting bei der Systemeinrichtung aktivieren und dokumentieren\n\n---&quot;}],&quot;quiz&quot;:[{&quot;nummer&quot;:1,&quot;frage&quot;:&quot;Was bedeutet die Pipeline `|` in PowerShell?&quot;,&quot;optionen&quot;:[&quot;Sie trennt Befehle voneinander&quot;,&quot;Sie leitet die Ausgabe eines Befehls als Eingabe an den nächsten Befehl weiter&quot;,&quot;Sie beendet einen Befehl&quot;,&quot;Sie erstellt eine neue Datei&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Die Pipeline leitet Objekte vom ersten zum nächsten Befehl weiter.&quot;},{&quot;nummer&quot;:2,&quot;frage&quot;:&quot;Welches Cmdlet zeigt alle laufenden Prozesse an?&quot;,&quot;optionen&quot;:[&quot;`Get-Process`&quot;,&quot;`Show-Process`&quot;,&quot;`List-Process`&quot;,&quot;`Display-Process`&quot;],&quot;antwort&quot;:0,&quot;erklaerung&quot;:&quot;`Get-Process` ist das Standard-Cmdlet zur Anzeige laufender Prozesse.&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Wie nennt man die Grundstruktur eines PowerShell-Befehls?&quot;,&quot;optionen&quot;:[&quot;`Verb-Noun`&quot;,&quot;`Substantiv-Verb`&quot;,&quot;`Befehl-Option`&quot;,&quot;`Get-Set`&quot;],&quot;antwort&quot;:0,&quot;erklaerung&quot;:&quot;PowerShell-Cmdlets folgen dem Muster `Verb-Noun` (z. B. `Get-Service`).&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Was passiert, wenn du ein Skript mit `.\\skript.ps1` startest und die Execution Policy ist `Restricted`?&quot;,&quot;optionen&quot;:[&quot;Das Skript wird ohne Warnung ausgeführt&quot;,&quot;Das Skript wird nicht ausgeführt und eine Fehlermeldung erscheint&quot;,&quot;Windows Installiert das Skript automatisch&quot;,&quot;Der Computer wird neu gestartet&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Die Execution Policy `Restricted` verhindert die Skriptausführung.&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Welches Cmdlet liest die Windows-Ereignisanzeige aus?&quot;,&quot;optionen&quot;:[&quot;`Get-EventLog`&quot;,&quot;`Read-Event`&quot;,&quot;`Show-Event`&quot;,&quot;`Get-Log`&quot;],&quot;antwort&quot;:0,&quot;erklaerung&quot;:&quot;`Get-EventLog` liest Einträge aus den Windows-Ereignisprotokollen.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Ein Mitarbeiter meldet: \&quot;Mein PC ist seit gestern extrem langsam. Ich habe viele Programme offen, aber das Problem trat auch nach einem Neustart auf. Ich arbeite dringend an einer Präsentation für heute.\&quot;&quot;,&quot;aufgabe&quot;:&quot;1. Erstelle einen Diagnose-Befehl mit PowerShell, der die CPU- und Speicherauslastung aktueller Prozesse anzeigt\n2. Identifiziere mögliche Ursache für die langsame Leistung\n3. Dokumentiere deine Befehle und Ergebnisse für den Fallbericht&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-13-powershell&quot;},{&quot;title&quot;:&quot;Modul 14: Software-Deployment, Intune/Entra ID Grundlagen&quot;,&quot;level&quot;:&quot;2&quot;,&quot;module&quot;:&quot;14&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/intune/fundamentals/what-is-intune&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/entra/fundamentals/whatis&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/intune/intune-service/apps/apps-windows-10-app-deploy&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/manage-roles-portal&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.comptia.org/en-us/blog/how-to-study-for-comptia-a/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/training/modules/intro-to-endpoint-manager/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/training/modules/manage-devices-with-microsoft-endpoint-manager/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/add-application-portal-setup-sso&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;Gerät wird nicht automatisch in Intune registriert&quot;,&quot;symptom&quot;:&quot;Gerät ist mit Entra ID verbunden, erscheint aber nicht in Intune&quot;,&quot;ursache&quot;:&quot;Automatische MDM-Registrierung ist nicht konfiguriert oder die Intune-Lizenz fehlt&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe, ob eine Intune-Lizenz für den Benutzer oder das Gerät zugewiesen ist&quot;,&quot;Prüfe unter Entra ID → Mobility (MDM und MAM) → Microsoft Intune die MDM-Benutzereinstellung&quot;,&quot;Prüfe, ob die automatische Registrierung konfiguriert ist&quot;],&quot;losung&quot;:&quot;1. Intune-Lizenz für den Benutzer zuweisen\n  2. Unter Entra ID → Mobility (MDM und MAM) die automatische Registrierung aktivieren\n  3. Alternative: Benutzer registriert Gerät manuell über die Company Portal-App&quot;,&quot;pravention&quot;:&quot;Automatische Registrierung bei allen neuen Geräten von Anfang an konfigurieren\n\n---&quot;},{&quot;titel&quot;:&quot;App-Installation schlägt fehl, obwohl App zugewiesen ist&quot;,&quot;symptom&quot;:&quot;Benutzer sieht App im Company Portal, Installation schlägt aber fehl&quot;,&quot;ursache&quot;:&quot;Falscher Installationsbefehl oder fehlende Erkennungsregel&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe den Installationsbefehl in der Intune-App-Konfiguration&quot;,&quot;Prüfe, ob die App auf dem Gerät bereits installiert ist (Evtl. wurde eine vorherige Installation nicht erkannt)&quot;,&quot;Prüfe das Intune-Protokoll unter dem Gerät in Intune&quot;],&quot;losung&quot;:&quot;1. Installationsbefehle überprüfen und ggf. korrigieren\n  2. Erkennungsregeln anpassen (z. B. korrekten Pfad oder Registry-Schlüssel prüfen)\n  3. App manuell deinstallieren und neu zuweisen&quot;,&quot;pravention&quot;:&quot;Apps vor der Zuweisung auf einem Referenzgerät testen\n\n---&quot;},{&quot;titel&quot;:&quot;Benutzer kann sich nicht anmelden — Conditional Access blockiert Zugriff&quot;,&quot;symptom&quot;:&quot;Benutzer meldet sich mit korrekten Zugangsdaten an, erhält aber Zugriffsverweigerung&quot;,&quot;ursache&quot;:&quot;Conditional Access-Richtlinie blockiert den Zugriff (z. B. Gerät nicht compliant, falscher Standort)&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe die Anmelde-Protokolle in Entra ID unter \&quot;Überwachen\&quot; → \&quot;Anmelde-Protokolle\&quot;&quot;,&quot;Prüfe, welche Conditional Access-Richtlinie den Zugriff blockiert hat&quot;,&quot;Prüfe die Geräte-Compliance in Intune&quot;],&quot;losung&quot;:&quot;1. Geräte-Compliance prüfen und ggf. Compliance-Richtlinie anpassen\n  2. Conditional Access-Richtlinie anpassen (z. B. Ausnahme für bestimmte Benutzergruppe)\n  3. Benutzer über den Blockierenden Zustand informieren und Lösung kommunizieren&quot;,&quot;pravention&quot;:&quot;Conditional Access-Richtlenien erst im \&quot;Berichtsmodus\&quot; aktivieren, bevor sie erzwungen werden\n\n---&quot;},{&quot;titel&quot;:&quot;Passwort-Reset funktioniert nicht — SSPR konfiguriert falsch&quot;,&quot;symptom&quot;:&quot;Benutzer kann Passwort nicht über Self-Service Password Reset (SSPR) zurücksetzen&quot;,&quot;ursache&quot;:&quot;SSPR ist nicht aktiviert oder die Authentifizierungsmethoden sind falsch konfiguriert&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe unter Entra ID → \&quot;Kennwortzurücksetzung\&quot; ob SSPR aktiviert ist&quot;,&quot;Prüfe, welche Authentifizierungsmethoden konfiguriert sind&quot;,&quot;Prüfe, ob der Benutzer für SSPR berechtigt ist (Gruppenzuweisung)&quot;],&quot;losung&quot;:&quot;1. SSPR in Entra ID aktivieren\n  2. Mindestens eine Authentifizierungsmethode konfigurieren (z. B. E-Mail oder Mobiltelefon)\n  3. SSPR-Benutzergruppe überprüfen&quot;,&quot;pravention&quot;:&quot;SSPR bei der Einführung von Entra ID konfigurieren und Schulungsmaterial für Benutzer bereitstellen\n\n---&quot;}],&quot;quiz&quot;:[{&quot;nummer&quot;:1,&quot;frage&quot;:&quot;Was ist der Hauptunterschied zwischen MDM und MAM bei Intune?&quot;,&quot;optionen&quot;:[&quot;MDM verwaltet nur Windows-Geräte, MAM nur mobile Geräte&quot;,&quot;MDM verwaltet das gesamte Gerät, MAM verwaltet nur einzelne Apps&quot;,&quot;MDM ist kostenlos, MAM kostet extra&quot;,&quot;Es gibt keinen Unterschied&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;MDM (Mobile Device Management) verwaltet das gesamte Gerät, MAM (Mobile Application Management) verwaltet nur einzelne Apps, auch auf BYOD-Geräten. Quelle: Microsoft Learn — \&quot;What is Microsoft Intune?\&quot; — abgerufen am 2026-10-19.&quot;},{&quot;nummer&quot;:2,&quot;frage&quot;:&quot;Was ist der erste Schritt beim Bereitstellen einer Win32-App in Intune?&quot;,&quot;optionen&quot;:[&quot;App in ein `.intunewin`-Paket konvertieren&quot;,&quot;App im Microsoft Store suchen&quot;,&quot;App manuell auf jedem Gerät installieren&quot;,&quot;Conditional Access-Richtlinie erstellen&quot;],&quot;antwort&quot;:0,&quot;erklaerung&quot;:&quot;Die Win32-App muss zuerst mit dem Microsoft Win32 Content Prep Tool in ein `.intunewin`-Paket konvertiert werden. Quelle: Microsoft Learn — \&quot;What is Microsoft Intune?\&quot; — abgerufen am 2026-10-19.&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Was bedeutet der Begriff \&quot;Tenant\&quot; in Entra ID?&quot;,&quot;optionen&quot;:[&quot;Ein physischer Server im Rechenzentrum&quot;,&quot;Eine Instanz von Entra ID für eine Organisation&quot;,&quot;Ein Benutzerkonto&quot;,&quot;Ein Netzwerksegment&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Ein Tenant ist eine Instanz von Entra ID, die einer Organisation zugeordnet ist. Quelle: Microsoft Learn — \&quot;What is Microsoft Entra ID?\&quot; — abgerufen am 2026-10-19.&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Welche Deployment-Methode ist für große Umgebungen mit hunderten Geräten am besten geeignet?&quot;,&quot;optionen&quot;:[&quot;Manuelle Installation&quot;,&quot;MDM-basiertes Deployment über Intune&quot;,&quot;Windows Update&quot;,&quot;Manuelles Kopieren von Dateien&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;MDM-basiertes Deployment über Intune ist für große Umgebungen am besten geeignet, da es skalierbar und zentral verwaltbar ist. Quelle: Microsoft Learn — \&quot;What is Microsoft Intune?\&quot; — abgerufen am 2026-10-19.&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Was tun, wenn ein Benutzer sich nicht anmelden kann und Conditional Access den Zugriff blockiert?&quot;,&quot;optionen&quot;:[&quot;Das Benutzerkonto löschen&quot;,&quot;Die Conditional Access-Richtlinie prüfen und ggf. anpassen&quot;,&quot;Den Benutzer ignorieren&quot;,&quot;Den PC neu aufsetzen&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Die Conditional Access-Richtlinie muss geprüft und ggf. angepasst werden (z. B. Geräte-Compliance überprüfen). Quelle: Microsoft Learn — \&quot;What is Microsoft Intune?\&quot; — abgerufen am 2026-10-19.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Ein neuer Mitarbeiter (Herr Schmidt) erhält sein neues Firmen-Laptop. Das Gerät ist mit Entra ID verbunden, wird aber nicht in Intune registriert. Der Mitarbeiter kann sich nicht bei den Unternehmens-Apps anmelden und bittet um Hilfe.&quot;,&quot;aufgabe&quot;:&quot;1. Was ist die Priorität dieses Tickets?\n2. Wie gehst du bei der Diagnose vor?\n3. Wie löst du das Problem?\n4. Dokumentiere den Fall für die Wissensdatenbank.&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-14-deployment&quot;},{&quot;title&quot;:&quot;Modul 15: Backup, Recovery, Patch-Management&quot;,&quot;level&quot;:&quot;2&quot;,&quot;module&quot;:&quot;15&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wbadmin&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows/deployment/update/waas-manage-updates-wsus&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows/privacy/windows-diagnostic-data&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.comptia.org/en-us/blog/how-to-study-for-comptia-a/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows/whats-new/whats-new-windows-11-version-23h2&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;Backup ohne Recovery-Test&quot;,&quot;symptom&quot;:&quot;Nach einem Hardware-Defekt stellt sich heraus, dass das Backup beschädigt oder unlesbar ist&quot;,&quot;ursache&quot;:&quot;Backup wurde erstellt, aber nie eine Wiederherstellung getestet&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe die Backup-Datei auf Integrität (Größe, Zeitstempel)&quot;,&quot;Versuche eine einzelne Datei aus dem Backup wiederherzustellen&quot;,&quot;Prüfe, ob das Backup-Laufwerk lesbar ist&quot;],&quot;losung&quot;:&quot;- Recovery-Test durchführen (mindestens quartalsweise)\n  - Backup auf neues Medium migrieren, falls Fehler erkannt\n  - Zwei Backup-Medien verwenden (3-2-1-Regel)&quot;,&quot;pravention&quot;:&quot;Automatisierte Recovery-Tests in den Backup-Zeitplan integrieren\n\n---&quot;},{&quot;titel&quot;:&quot;System-Image auf anderer Hardware wiederhergestellt&quot;,&quot;symptom&quot;:&quot;BSOD (Blue Screen) nach Systemimage-Wiederherstellung auf einen anderen PC&quot;,&quot;ursache&quot;:&quot;Systemimage ist hardwaregebunden (andere CPU, Chipsatz, Treiber)&quot;,&quot;diagnose_schritte&quot;:[&quot;Starte im abgesicherten Modus (F8 oder Shift + Neustart)&quot;,&quot;Prüfe die angeschlossenen Treiber (Geräte-Manager)&quot;,&quot;Deinstalliere Hardware-spezifische Treiber&quot;],&quot;losung&quot;:&quot;- Treiber der Zielhardware installieren\n  - Falls nicht bootfähig: Wiederherstellungsmedium verwenden und Reparatur starten&quot;,&quot;pravention&quot;:&quot;Systemimages nur für identische Hardware verwenden; für Hardwarewechsel Dateibackup + saubere Installation bevorzugen\n\n---&quot;},{&quot;titel&quot;:&quot;Patches ohne Test direkt auf Produktivsysteme&quot;,&quot;symptom&quot;:&quot;Nach dem Update startet ein kritischer Dienst nicht mehr (z. B. Datenbank, Buchhaltungs-Software)&quot;,&quot;ursache&quot;:&quot;Update wurde ohne Testumgebung auf allen Systemen gleichzeitig installiert&quot;,&quot;diagnose_schritte&quot;:[&quot;Updateverlauf prüfen (Einstellungen → Windows Update → Updateverlauf)&quot;,&quot;Identifiziere das zuletzt installierte Update&quot;,&quot;Prüfe Hersteller-Kompatibilität der betroffenen Software&quot;],&quot;losung&quot;:&quot;- Problematic Update deinstallieren (Updateverlauf → Updates deinstallieren)\n  - Warten auf Korrektur-Update\n  - Auf betroffenen Systemen Update pausieren&quot;,&quot;pravention&quot;:&quot;Ringweiser Rollout — erst Testgruppe, dann Pilotgruppe, dann gesamte Produktionsumgebung\n\n---&quot;},{&quot;titel&quot;:&quot;Kein Offline-Backup — Ransomware verschlüsselt auch Backup-Laufwerk&quot;,&quot;symptom&quot;:&quot;Sowohl Produktionsdaten als auch das angeschlossene Backup-Laufwerk sind verschlüsselt&quot;,&quot;ursache&quot;:&quot;Backup-Laufwerk war dauerhaft angeschlossen und wurde von der Ransomware mitverschlüsselt&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe, welche Laufwerke verschlüsselt sind (Dateierweiterung, Readme-Datei)&quot;,&quot;Identiziere die Ransomware-Variante&quot;,&quot;Prüfe, ob ein offline Backup (nicht angeschlossen) existiert&quot;],&quot;losung&quot;:&quot;- Offline-Backup herstellen\n  - Falls nicht vorhanden: Versuch einer Entschlüsselung (NoMoreRansom.org) oder neu aufsetzen&quot;,&quot;pravention&quot;:&quot;Mindestens ein Backup-Laufwerk physischalisch trennen oder Cloud-Backup mit Versionierung verwenden\n\n---&quot;}],&quot;quiz&quot;:[{&quot;nummer&quot;:1,&quot;frage&quot;:&quot;Was besagt die 3-2-1-Backup-Regel?&quot;,&quot;optionen&quot;:[&quot;3 Backups, 2 Medien, 1 Cloud&quot;,&quot;3 Kopien der Daten, 2 verschiedene Medien, 1 Kopie offline&quot;,&quot;3 verschiedene Backup-Typen, 2 Wiederherstellungen, 1 Test&quot;,&quot;3 Tage zwischen Backups, 2 Laufwerke, 1 Administrator&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;3 Kopien, 2 Medien, 1 Kopie offline.&quot;},{&quot;nummer&quot;:2,&quot;frage&quot;:&quot;Welcher Backup-Typ benötigt bei der Wiederherstellung das Vollbackup UND alle Inkrementaldaten?&quot;,&quot;optionen&quot;:[&quot;Vollbackup&quot;,&quot;Differenzialbackup&quot;,&quot;Inkrementellbackup&quot;,&quot;Systemimage&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;Inkrementelle Backups brauchen die komplette Sequenz.&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Was ist der Hauptunterschied zwischen einem System-Image-Backup und einem Datei-Backup?&quot;,&quot;optionen&quot;:[&quot;Ein System-Image ist immer kleiner&quot;,&quot;Ein System-Image enthält Windows, Programme, Einstellungen und Dateien; ein Datei-Backup nur ausgewählte Dateien&quot;,&quot;Ein Datei-Backup ist schneller&quot;,&quot;Es gibt keinen Unterschied&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;System-Image = komplettes Laufwerk, Datei-Backup = ausgewählte Dateien.&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Was bedeutet WSUS?&quot;,&quot;optionen&quot;:[&quot;Windows System Update Service&quot;,&quot;Windows Server Update Services&quot;,&quot;Windows Security Update System&quot;,&quot;Windows Software Update Service&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Windows Server Update Services.&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Warum muss ein Backup regelmäßig auf Wiederherstellbarkeit getestet werden?&quot;,&quot;optionen&quot;:[&quot;Weil Microsoft es vorschreibt&quot;,&quot;Weil sich sonst die Backup-Datei automatisch löscht&quot;,&quot;Weil nur ein erfolgreicher Recovery-Test die Integrität beweist&quot;,&quot;Weil das Backup-Laufwerk sonst defekt wird&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;Nur ein erfolgreicher Recovery-Test beweist, dass das Backup brauchbar ist.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Die Buchhaltung meldet: \&quot;Seit dem Windows Update gestern Abend startet Excel nicht mehr. Es kommt sofort ein Fehler 'Excel kann nicht gestartet werden'. Wir müssen heute die Monatsabschluss machen — bitte schnell!\&quot;&quot;,&quot;aufgabe&quot;:&quot;1. Was ist die Priorität dieses Tickets?\n2. Wie gehst du bei der Diagnose vor?\n3. Wie löst du das Problem?\n4. Was ist die langfristige Prävention?&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-15-backup-patch&quot;},{&quot;title&quot;:&quot;Modul 16: Incident- und Problem-Management (ITIL), Dokumentation, Wissensdatenbank&quot;,&quot;level&quot;:&quot;2&quot;,&quot;module&quot;:&quot;16&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.ibm.com/think/topics/it-infrastructure-library&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.itil.org.uk/training/itil-foundation-level-courses/itil-foundation-training&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.comptia.org/en-us/blog/how-to-study-for-comptia-a/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;Incident und Problem werden nicht unterschieden&quot;,&quot;symptom&quot;:&quot;Wiederkehrende Incidents, keine Ursachenanalyse&quot;,&quot;ursache&quot;:&quot;Team schließt Incidents mit Workaround, aber Problem bleibt unbemerkt&quot;,&quot;diagnose_schritte&quot;:[&quot;Suche in den letzten 30 Tickets nach wiederkehrenden Symptomen&quot;,&quot;Identifiziere Ticket mit gleicher Kategorie und ähnlicher Beschreibung&quot;,&quot;Prüfe, ob ein Problem-Ticket existiert&quot;],&quot;losung&quot;:&quot;- Problem-Ticket für das wiederkehrende Symptom erstellen\n  - Alle betroffenen Incidents mit dem Problem-Ticket verknüpfen\n  - Root-Cause-Analyse (z. B. 5 Whys) durchführen&quot;,&quot;pravention&quot;:&quot;Nach jedem Incident die Frage: „Ist das ein Symptom eines größeren Problems?\&quot;\n- Quelle: ITIL 4 Foundation, abgerufen am 2026-10-19\n\n---&quot;},{&quot;titel&quot;:&quot;Known Error nicht in der KEDB dokumentiert&quot;,&quot;symptom&quot;:&quot;Kollege findet keine Lösung für wiederkehrendes Problem&quot;,&quot;ursache&quot;:&quot;Problem wurde gelöst, aber nicht als Known Error dokumentiert&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe die Ticket-Historie auf gelöste Probleme&quot;,&quot;Identifiziere Probleme mit dokumentierter Lösung&quot;,&quot;Prüfe, ob diese in der KEDB erfasst sind&quot;],&quot;losung&quot;:&quot;- Known Error-Eintrag in der KEDB erstellen\n  - Lösung und Workaround detailliert beschreiben\n  - Betroffene Incidents verknüpfen&quot;,&quot;pravention&quot;:&quot;Nach jeder Problem-Lösung automatisch KEDB-Eintrag erstellen\n- Quelle: ITIL 4 Foundation, abgerufen am 2026-10-19\n\n---&quot;},{&quot;titel&quot;:&quot;Wissensdatenbank veraltet und ungenutzt&quot;,&quot;symptom&quot;:&quot;Nutzer finden keine aktuellen Lösungen, stellen wiederholt Tickets&quot;,&quot;ursache&quot;:&quot;Wissensdatenbank wird nicht geprüft und aktualisiert&quot;,&quot;diagnose_schritte&quot;:[&quot;Zähle die Artikel in der Wissensdatenbank&quot;,&quot;Prüfe die letzte Änderung der 10 ältesten Artikel&quot;,&quot;Vergleiche mit den häufigsten Ticket-Kategorien&quot;],&quot;losung&quot;:&quot;- Regelmäßigen Review-Prozess einführen (quartalsweise)\n  - Nicht mehr zutreffende Artikel archivieren\n  - Verknüpfung zu den Top-10-Ticket-Kategorien herstellen&quot;,&quot;pravention&quot;:&quot;Verantwortliche Person für Wissensdatenbank benennen\n- Quelle: IBM ITIL Overview, abgerufen am 2026-10-19\n\n---&quot;},{&quot;titel&quot;:&quot;Dokumentation unvollständig oder unverständlich&quot;,&quot;symptom&quot;:&quot;Kollege kann übernommenes Ticket nicht bearbeiten&quot;,&quot;ursache&quot;:&quot;Ticket wurde mit unklaren oder fehlenden Informationen geschlossen&quot;,&quot;diagnose_schritte&quot;:[&quot;Öffne 10 zufällig gewählte Tickets der letzten Woche&quot;,&quot;Prüfe, ob alle Felder (Beschreibung, Diagnose, Lösung, Verifizierung) ausgefüllt sind&quot;,&quot;Frage dich: „Könnte ein Kollege das Ticket ohne weitere Informationen bearbeiten?\&quot;&quot;],&quot;losung&quot;:&quot;- Tickets nachbearbeiten und Lücken schließen\n  - Dokumentations-Checkliste einführen:\n    - [ ] Beschreibung des Problems\n    - [ ] Diagnose-Schritte\n    - [ ] Lösung / Workaround\n    - [ ] Verifizierung (Problem bestätigt gelöst?)\n    - [ ] Verknüpfung zu betroffenen Incidents/Problemen&quot;,&quot;pravention&quot;:&quot;Dokumentationsstandard bei der Team-Schulung vermitteln\n- Quelle: IBM ITIL Overview, abgerufen am 2026-10-19\n\n---&quot;}],&quot;quiz&quot;:[{&quot;nummer&quot;:1,&quot;frage&quot;:&quot;Was ist die ITIL-Definition eines Incidents?&quot;,&quot;optionen&quot;:[&quot;Eine geplante Wartung eines IT-Services&quot;,&quot;Eine ungeplante Unterbrechung oder Qualitätsminderung eines IT-Service&quot;,&quot;Eine Anfrage nach neuer Hardware&quot;,&quot;Ein dokumentiertes Problem mit bekannter Lösung&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;„Ein Incident ist eine ungeplante Unterbrechung eines IT-Service oder eine Qualitätsminderung eines IT-Service.\&quot; Quelle: ITIL 4 Foundation, abgerufen am 2026-10-19&quot;},{&quot;nummer&quot;:2,&quot;frage&quot;:&quot;Was ist der Hauptunterschied zwischen Incident Management und Problem Management?&quot;,&quot;optionen&quot;:[&quot;Incident Management ist schneller als Problem Management&quot;,&quot;Incident Management stellt den Service wieder her, Problem Management beseitigt die Ursache&quot;,&quot;Problem Management ist nur für kritische Incidents&quot;,&quot;Es gibt keinen Unterschied&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Incident Management fokussiert auf Wiederherstellung, Problem Management auf Ursachenbeseitigung. Quelle: ITIL 4 Foundation, abgerufen am 2026-10-19&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Was ist ein Known Error?&quot;,&quot;optionen&quot;:[&quot;Ein Incident, der noch nicht gelöst ist&quot;,&quot;Ein Problem, das diagnostiziert wurde und für das eine dokumentierte Lösung oder ein Workaround vorhanden ist&quot;,&quot;Ein Fehler in der Software&quot;,&quot;Ein Problem, das nie auftritt&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;„Ein Known Error ist ein Problem, das diagnostiziert wurde und für das eine dokumentierte Lösung oder ein dokumentierter Workaround vorhanden ist.\&quot; Quelle: ITIL 4 Foundation, abgerufen am 2026-10-19&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Was ist das Ziel des Service Knowledge Management System (SKMS)?&quot;,&quot;optionen&quot;:[&quot;Alle Mitarbeiter zu überwachen&quot;,&quot;Wissen und Informationen zu verwalten und zugänglich zu machen&quot;,&quot;Tickets automatisch zu lösen&quot;,&quot;Hardware-Inventar zu verwalten&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Das SKMS ist ein System zur Verwaltung von Wissen und Informationen. Quelle: ITIL 4 Foundation, abgerufen am 2026-10-19&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Welche Methode eignet sich am besten für die Ursachenanalyse eines komplexen Netzwerkproblems mit mehreren Einflussfaktoren?&quot;,&quot;optionen&quot;:[&quot;5 Whys&quot;,&quot;Ishikawa-Diagramm&quot;,&quot;Passwort-Reset&quot;,&quot;Neustart des Rechners&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Das Ishikawa-Diagramm eignet sich für komplexe Probleme mit mehreren Einflussfaktoren. Quelle: IBM ITIL Overview, abgerufen am 2026-10-19&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Zwei Mitarbeiter aus unterschiedlichen Abteilungen melden sich zeitgleich mit dem gleichen Problem: „Ich kann seit heute Morgen nicht auf die Dateifreigabe zugreifen. Ich erhalte die Fehlermeldung „Zugriff verweigert\&quot;. Ich habe gestern mein Passwort geändert.\&quot;&quot;,&quot;aufgabe&quot;:&quot;1. Erstelle ein Incident-Ticket für jeden Melder\n2. Erstelle ein Problem-Ticket (da mehrere Benutzer betroffen sind)\n3. Führe eine vereinfachte Root-Cause-Analyse durch (5 Whys)\n4. Dokumentiere den Fall in der Wissensdatenbank&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-16-itil&quot;},{&quot;title&quot;:&quot;Modul 17: Abschlussprojekt + Prüfungssimulation&quot;,&quot;level&quot;:&quot;2&quot;,&quot;module&quot;:&quot;17&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.comptia.org/certifications/a&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/de-de/training/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.ihk.de/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/de-de/windows/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;Zeitmanagement in der Prüfung schlecht&quot;,&quot;symptom&quot;:&quot;Nicht alle Fragen bearbeitet, obwohl die Antworten gewusst wurden&quot;,&quot;ursache&quot;:&quot;Zu viel Zeit für einzelne Fragen aufgewendet&quot;,&quot;diagnose_schritte&quot;:[&quot;Nach der Prüfung: Wie viel Zeit habe ich pro Frage gebraucht?&quot;,&quot;Identifiziere, welche Fragearten am meisten Zeit beansprucht haben&quot;,&
