e prüft die Dokumentation&quot;,&quot;pravention&quot;:&quot;Dokumentation als festen Bestandteil des Ticket-Workflows etablieren\n\n---&quot;},{&quot;titel&quot;:&quot;Prüfungsangst und unvorbereiteter Start&quot;,&quot;symptom&quot;:&quot;Panik in der Prüfung, Fragen werden falsch gelesen&quot;,&quot;ursache&quot;:&quot;Unzureichende Vorbereitung, keine Simulationsprüfungen absolviert&quot;,&quot;diagnose_schritte&quot;:[&quot;Bewerte dein Vorbereitungsniveau ehrlich (1–10)&quot;,&quot;Prüfe, ob du alle Prüfungsthemen abgedeckt hast&quot;,&quot;Überlege, ob du ausreichend Schlaf und Pausen in der Vorbereitung eingebaut hast&quot;],&quot;losung&quot;:&quot;- 2 Wochen vor der Prüfung: Tägliche 30-Minuten-Übungen\n  - 1 Woche vor der Prüfung: Vollständige Simulation unter realen Bedingungen\n  - 1 Tag vor der Prüfung: Keine neuen Themen mehr, nur Wiederholung&quot;,&quot;pravention&quot;:&quot;Frühzeitige Planung — mindestens 4 Wochen Vorbereitungszeit einplanen\n\n---&quot;}],&quot;quiz&quot;:[{&quot;nummer&quot;:1,&quot;frage&quot;:&quot;Wie lange dauert eine CompTIA A+-Prüfung?&quot;,&quot;optionen&quot;:[&quot;60 Minuten&quot;,&quot;90 Minuten&quot;,&quot;120 Minuten&quot;,&quot;180 Minuten&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;90 Minuten pro Prüfung.&quot;},{&quot;nummer&quot;:2,&quot;frage&quot;:&quot;Was bedeutet die Abkürzung PBQ?&quot;,&quot;optionen&quot;:[&quot;Performance-Based Question&quot;,&quot;Practice-Based Quiz&quot;,&quot;Pre-Board Question&quot;,&quot;Personal Benchmark Query&quot;],&quot;antwort&quot;:0,&quot;erklaerung&quot;:&quot;Performance-Based Question.&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Welche A+-Prüfung behandelt Betriebssysteme und Sicherheit?&quot;,&quot;optionen&quot;:[&quot;220-1101 (Core 1)&quot;,&quot;220-1102 (Core 2)&quot;,&quot;220-1103 (Core 3)&quot;,&quot;220-1104 (Core 4)&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;220-1102 (Core 2) behandelt Operating Systems, Security und Software Troubleshooting.&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Welches ist die beste Methode, um Prüfungsangst zu reduzieren?&quot;,&quot;optionen&quot;:[&quot;Viele neue Themen kurz vor der Prüfung lernen&quot;,&quot;Simulationsprüfungen unter realen Bedingungen absolvieren&quot;,&quot;Ausreichend Schlaf in der Nacht vor der Prüfung&quot;,&quot;Koffein in großen Mengen konsumieren&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Simulationsprüfungen schaffen Vertrautheit mit dem Format und reduzieren Unsicherheit.&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Was ist der wichtigste Bestandteil der Ticket-Dokumentation?&quot;,&quot;optionen&quot;:[&quot;Lange, komplexe Sätze&quot;,&quot;Alle Schritte, Befunde und Lösungen nachvollziehbar dokumentieren&quot;,&quot;Nur das Endergebnis notieren&quot;,&quot;Persönliche Meinungen zum Benutzer einfügen&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Nachvollziehbarkeit ist das A und O der Dokumentation.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Du bist der IT-Support der Muster GmbH (50 Mitarbeiter). Am Montagmorgen kommen drei Tickets gleichzeitig:&quot;,&quot;aufgabe&quot;:&quot;1. Priorisiere die Tickets und begründe deine Reihenfolge.\n2. Beschreibe deine Diagnose für T1 in 4 Schritten.\n3. Was ist dein erster Schritt bei T2?\n4. Erstelle eine Checkliste für T3 (neuer Arbeitsplatz).&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-17-abschluss&quot;},{&quot;title&quot;:&quot;Modul 2: Hardware — PC-Aufbau, Diagnose, Peripherie, Drucker&quot;,&quot;level&quot;:&quot;1&quot;,&quot;module&quot;:&quot;2&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.comptia.org/en-us/blog/how-to-study-for-comptia-a/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.professormesser.com/free-a-plus-training/220-1101/220-1101-video/220-1101-training-course/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/training/modules/troubleshoot-device-driver-failures/2-examine-tools-manage-troubleshoot-device-drivers&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://support.microsoft.com/en-us/windows/hardware/printer/fix-printer-not-found-and-printer-not-recognized-errors-in-windows&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;PC startet nicht — PSU-Problem&quot;,&quot;symptom&quot;:&quot;PC reagiert nicht auf den Power-Button, keine Lüfter, keine LEDs&quot;,&quot;ursache&quot;:&quot;Netzteil defekt oder nicht korrekt angeschlossen&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe, ob das Netzkabel in der Steckdose und im PSU steckt&quot;,&quot;Prüfe, ob der Netzschalter am PSU auf \&quot;I\&quot; (ein) steht&quot;,&quot;Prüfe, ob das 24-Pin-Motherboard-Kabel und das 8-Pin-CPU-Kabel fest sitzen&quot;,&quot;Falls verfügbar: PSU mit einem Multimeter testen oder gegen einen bekannten guten PSU tauschen&quot;],&quot;losung&quot;:&quot;- PSU austauschen (nur durch geschultes Personal!)\n  - Korrekte Wattzahl beachten (mindestens 20 % Reserve)&quot;,&quot;pravention&quot;:&quot;PSU-Auswahl immer mit Reserve planen, qualitativ hochwertige Komponenten verwenden\n\n---&quot;},{&quot;titel&quot;:&quot;Blue Screen — RAM-Problem&quot;,&quot;symptom&quot;:&quot;PC startet, aber irgendwann BSOD mit MEMORY_MANAGEMENT oder CRITICAL_PROCESS_DIED&quot;,&quot;ursache&quot;:&quot;Defektes RAM-Modul oder falscher RAM-Typ&quot;,&quot;diagnose_schritte&quot;:[&quot;BSOD-Fehlercode notieren&quot;,&quot;Windows Memory Diagnostic ausführen: `mdsched.exe` → Neustart&quot;,&quot;Bei Fehler: Module einzeln testen (eines nach dem anderen entfernen)&quot;,&quot;RAM-Typ mit Motherboard-Kompatibilität prüfen&quot;],&quot;losung&quot;:&quot;- Defektes RAM-Modul austauschen\n  - Module korrekt einsetzen (bis der Klick zu hören ist)\n  - Kompatiblen RAM-Typ verwenden (DDR4/DDR5 je nach Motherboard)&quot;,&quot;pravention&quot;:&quot;RAM-Käufe immer an Motherboard-Sockel anpassen\n\n---&quot;},{&quot;titel&quot;:&quot;USB-Gerät wird nicht erkannt&quot;,&quot;symptom&quot;:&quot;USB-Gerät angeschlossen, aber Windows zeigt nichts an oder \&quot;USB-Gerät nicht erkannt\&quot;&quot;,&quot;ursache&quot;:&quot;Treiberproblem, defektes Kabel, defekter USB-Port oder Gerät defekt&quot;,&quot;diagnose_schritte&quot;:[&quot;Gerät an einem anderen USB-Port testen&quot;,&quot;Gerät an einem anderen PC testen&quot;,&quot;Kabel tauschen&quot;,&quot;Geräte-Manager → USB-Controller → Treiber aktualisieren&quot;,&quot;Gerät deinstallieren und neu starten&quot;],&quot;losung&quot;:&quot;- Treiber aktualisieren oder neu installieren\n  - USB-Port oder Kabel austauschen\n  - Falls Gerät defekt: Austausch&quot;,&quot;pravention&quot;:&quot;Hohe Kabelqualität verwenden, Geräte sicher entfernen (Safely Remove Hardware)\n\n---&quot;},{&quot;titel&quot;:&quot;Drucker druckt nicht&quot;,&quot;symptom&quot;:&quot;Drucker ist angeschlossen, aber Druckaufträge bleiben in der Warteschlange oder es wird nichts gedruckt&quot;,&quot;ursache&quot;:&quot;Treiberproblem, Verbindungsproblem, Papierstau oder Druckerwarteschlange blockiert&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe, ob Drucker eingeschaltet ist&quot;,&quot;Prüfe die Verbindung (USB-Kabel oder Netzwerk)&quot;,&quot;Prüfe die Druckwarteschlange: Start → \&quot;Drucker und Scanner\&quot; → Drucker wählen → \&quot;Druckwarteschlange öffnen\&quot;&quot;,&quot;Falls Aufträge hängen: Warteschlause leeren (Alle Aufträge abbrechen)&quot;,&quot;Testseite drucken: Einstellungen → Drucker → \&quot;Testseite drucken\&quot;&quot;,&quot;Treiber prüfen: Geräte-Manager → Drucker → Treiber aktualisieren&quot;],&quot;losung&quot;:&quot;- Druckwarteschlange leeren und neu starten\n  - Treiber aktualisieren oder neu installieren\n  - Verbindung prüfen (Kabel/Netzwerk)\n  - Drucker-Einstellungen prüfen (Papier, Farbe, Duplex)&quot;,&quot;pravention&quot;:&quot;Regelmäßige Wartung, aktuelle Treiber, Druckwarteschlause bei Störungen zuerst prüfen\n\n---&quot;}],&quot;quiz&quot;:[{&quot;nummer&quot;:1,&quot;frage&quot;:&quot;Was bedeutet POST?&quot;,&quot;optionen&quot;:[&quot;Power Off System Test&quot;,&quot;Power On Self Test&quot;,&quot;Peripheral Operation System Test&quot;,&quot;Personal Office Startup Test&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Power On Self Test.&quot;},{&quot;nummer&quot;:2,&quot;frage&quot;:&quot;Ein PC startet nicht (keine Lüfter, keine LEDs). Was ist die wahrscheinlichste Ursache?&quot;,&quot;optionen&quot;:[&quot;Defekte Festplatte&quot;,&quot;Defektes Netzteil&quot;,&quot;Defekte Grafikkarte&quot;,&quot;Defekter Monitor&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Defektes Netzteil (PSU-Problem).&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Ein USB-Gerät wird nicht erkannt. Was ist der erste Schritt?&quot;,&quot;optionen&quot;:[&quot;Windows neu installieren&quot;,&quot;An einem anderen USB-Port testen&quot;,&quot;Treiber aktualisieren&quot;,&quot;PC neu starten&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;An einem anderen USB-Port testen.&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Welcher Fehlercode deutet auf ein RAM-Problem hin?&quot;,&quot;optionen&quot;:[&quot;CRITICAL_PROCESS_DIED&quot;,&quot;NTFS_FILE_SYSTEM&quot;,&quot;MEMORY_MANAGEMENT&quot;,&quot;DRIVER_IRQL_NOT_LESS_OR_EQUAL&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;MEMORY_MANAGEMENT.&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Was ist der erste Schritt bei einem Druckerproblem?&quot;,&quot;optionen&quot;:[&quot;Windows neu installieren&quot;,&quot;Druckerwarteschlange prüfen und leeren&quot;,&quot;Drucker zurücksetzen&quot;,&quot;Treiber deinstallieren&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Druckerwarteschlange prüfen und leeren.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Ein Mitarbeiter meldet: \&quot;Ich habe gestern einen neuen USB-Hub angeschlossen und seitdem funktioniert meine Tastatur nicht mehr. Die Maus geht noch. Ich habe schon versucht, die Tastatur an einen anderen USB-Port zu stecken, aber nichts hilft. Ich muss dringend meine E-Mails beantworten.\&quot;&quot;,&quot;aufgabe&quot;:&quot;1. Was ist die Priorität dieses Tickets?\n2. Wie gehst du bei der Diagnose vor?\n3. Wie löst du das Problem?\n4. Dokumentiere den Fall für die Wissensdatenbank.&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-2-hardware&quot;},{&quot;title&quot;:&quot;Modul 3: Windows 11 Grundlagen — Einstellungen, Konten, Updates, Treiber&quot;,&quot;level&quot;:&quot;1&quot;,&quot;module&quot;:&quot;3&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://learn.microsoft.com/windows/deployment/update/windows-update-overview&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/windows-hardware/drivers/install/driver-signing&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/windows/identity-protection/hello-for-business/hello-overview&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.comptia.org/certifications/a&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;Updates werden nicht installiert&quot;,&quot;symptom&quot;:&quot;Windows Update meldet „Es sind keine Updates verfügbar\&quot; oder hängt bei 0 % / 99 %&quot;,&quot;ursache&quot;:&quot;Beschädigte Windows Update-Komponenten, blockierte Dienste oder Plattenplatzmangel&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe den freien Speicherplatz (mindestens 10 GB empfohlen für Feature-Updates)&quot;,&quot;Prüfe, ob der Windows Update-Dienst (wuauserv) läuft: `Get-Service wuauserv`&quot;,&quot;Öffne die Update-Verlauf — gibt es fehlgeschlagene Updates mit Fehlercode?&quot;,&quot;Führe die Windows Update-Fehlerbehebung aus: Einstellungen → System → Problembehandlung → Weitere Problembehandlungen → Windows Update&quot;],&quot;losung&quot;:&quot;- Den Windows Update-Dienst neu starten: `net stop wuauserv` → `net start wuauserv`\n  - Den SoftwareDistribution-Ordner leeren (nach Stopp des Dienstes): `C:\\Windows\\SoftwareDistribution\\Download`\n  - Den DISM- und SFC-Scan ausführen: `DISM /Online /Cleanup-Image /RestoreHealth` danach `sfc /scannow`&quot;,&quot;pravention&quot;:&quot;Regelmäßig freien Speicherplatz prüfen und Updates nicht über den Zeitraum der Aktiven Stunden hinaus pausieren\n\n---&quot;},{&quot;titel&quot;:&quot;Nach Treiber-Update funktioniert Hardware nicht mehr&quot;,&quot;symptom&quot;:&quot;Gerät meldet Fehlercode 43 oder 10 im Geräte-Manager, Hardware reagiert nicht&quot;,&quot;ursache&quot;:&quot;Kompatibilitätsproblem zwischen neuem Treiber und Hardware oder Windows-Version&quot;,&quot;diagnose_schritte&quot;:[&quot;Öffne den Geräte-Manager und prüfe den Fehlercode im Geräte-Status&quot;,&quot;Notiere aktuelle Treiberversion und Anbieter&quot;,&quot;Prüfe, ob ein vorheriger Treiber in den Systemwiederherstellungsverfügbar ist&quot;],&quot;losung&quot;:&quot;- Treiber zurücksetzen: Geräte-Manager → Gerät → Reiter „Treiber\&quot; → „Treiber zurücksetzen\&quot;\n  - Falls nicht verfügbar: „Gerät deinstallieren\&quot; (Treiber entfernen) und neu starten\n  - Alternativ: Neuester Treiber von der Hersteller-Website manuell installieren&quot;,&quot;pravention&quot;:&quot;Vor wichtigen Treiber-Updates einen Systemwiederherstellungspunkt erstellen (`Win + R` → `rstrui.exe`)\n\n---&quot;},{&quot;titel&quot;:&quot;Benutzer meldet „Ich kann mich nicht anmelden\&quot; nach Kontotyp-Wechsel&quot;,&quot;symptom&quot;:&quot;Anmeldeseite zeigt falsche Kontoverknüpfung, PIN wird nicht akzeptiert, „Falsches Passwort\&quot;&quot;,&quot;ursache&quot;:&quot;Lokales Konto wurde in Microsoft-Konto umgewandelt oder umgekehrt; Anmeldeinformationen-Cache ist inkonsistent&quot;,&quot;diagnose_schritte&quot;:[&quot;Frage den Benutzer: Wann trat das Problem erstmals auf? Gab es einen Kontotyp-Wechsel?&quot;,&quot;Prüfe, ob der Benutzer sich mit der richtigen E-Mail-Adresse anmeldet&quot;,&quot;Öffne (falls Administrator) `control userpasswords2` oder Einstellungen → Konten — welcher Kontotyp ist konfiguriert?&quot;],&quot;losung&quot;:&quot;- Falls PIN nicht akzeptiert: „Ich habe meine PIN vergessen\&quot; auf der Anmeldeseite verwenden → Passwort-Reset über Microsoft-Konto\n  - Falls Anmeldeinformationen inkonsistent: Credential Manager öffnen (`control keymgr.dll`) und Einträge für das betroffene Konto entfernen\n  - Falls Kontotyp falsch: Erst lokales Konto erstellen und dann unter Einstellungen → Konten in Microsoft-Konto umwandeln&quot;,&quot;pravention&quot;:&quot;Vor Kontotyp-Wechsel sicherstellen, dass der Benutzer das aktuelle Passwort kennt und Zugriff auf die hinterlegte E-Mail-Adresse hat\n\n---&quot;},{&quot;titel&quot;:&quot;Deinstallierte Updates kommen wieder zurück&quot;,&quot;symptom&quot;:&quot;Ein Update wurde deinstalliert, installiert sich nach Neustart erneut automatisch&quot;,&quot;ursache&quot;:&quot;Windows Update hält das Update für erforderlich (besonders Sicherheitsupdates), oder ein Schadspiel des Update-Diensts&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe den Update-Verlauf — ist das Update tatsächlich deinstalliert?&quot;,&quot;Suche das KB-Artikelnummer des betroffenen Updates in der Microsoft-Dokumentation&quot;,&quot;Prüfe, ob eine Gruppenrichtlinie oder Windows Update for Business das Update erzwingt&quot;],&quot;losung&quot;:&quot;- Update mit dem Windows Update Troubleshooter zurückhalten: Einstellungen → System → Problembehandlung → Windows Update\n  - Alternativ: PowerShell `wushowhide.diagcab` (Microsoft-Tool zum Ausblenden von Updates)\n  - Bei Unternehmen: Windows Update for Business- oder WSUS-Konfiguration prüfen, ob Updates über IT-Richtlinien erzwungen werden&quot;,&quot;pravention&quot;:&quot;Vor Deinstallation prüfen, ob das Update kritisch ist — Sicherheitsupdates sollte man nicht dauerhaft entfernen\n\n---&quot;}],&quot;quiz&quot;:[{&quot;nummer&quot;:1,&quot;frage&quot;:&quot;Was ist der schnellste Weg, um den Geräte-Manager in Windows 11 zu öffnen?&quot;,&quot;optionen&quot;:[&quot;`Win + R` → `devmgmt.msc`&quot;,&quot;`Win + X` → Geräte-Manager&quot;,&quot;Einstellungen → System → Info → Geräte-Manager&quot;,&quot;Alle oben genannten sind korrekt&quot;],&quot;antwort&quot;:3,&quot;erklaerung&quot;:&quot;Alle drei Wege öffnen den Geräte-Manager.&quot;},{&quot;nummer&quot;:2,&quot;frage&quot;:&quot;Welcher Kontotyp in Windows 11 ist für unternehmensverwaltete Geräte mit Intune am besten geeignet?&quot;,&quot;optionen&quot;:[&quot;Lokales Konto&quot;,&quot;Microsoft-Konto&quot;,&quot;Azure AD / Microsoft Entra ID&quot;,&quot;Gastkonto&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;Azure AD / Microsoft Entra ID ermöglicht zentrale Verwaltung durch den IT-Administrator.&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Ein Gerät im Geräte-Manager zeigt den Fehlercode 43. Was ist die wahrscheinlichste Ursache?&quot;,&quot;optionen&quot;:[&quot;Der Treiber ist nicht installiert oder beschädigt&quot;,&quot;Das Gerät ist deaktiviert&quot;,&quot;Der Netzwerkadapter hat kein Netzwerk-Kabel&quot;,&quot;Der Bildschirm ist defekt&quot;],&quot;antwort&quot;:0,&quot;erklaerung&quot;:&quot;Fehlercode 43 bedeutet, dass Windows das Gerät ordnungsgemäß erkennt, aber der Treiber meldet ein Problem.&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Was passiert bei einer Pausierung von Windows Updates für 5 Wochen?&quot;,&quot;optionen&quot;:[&quot;Alle Updates (inkl. Sicherheitsupdates) werden für 5 Wochen blockiert&quot;,&quot;Nur Funktionsupdates werden blockiert&quot;,&quot;Sicherheitsupdates werden weiterhin installiert, nur große Updates werden blockiert&quot;,&quot;Der PC wird für 5 Wochen nicht mehr neu gestartet&quot;],&quot;antwort&quot;:0,&quot;erklaerung&quot;:&quot;Die Pausierung blockiert alle Arten von Updates für den gewählten Zeitraum (maximal 5 Wochen).&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Warum sind digitale Treibersignaturen in Windows 11 (64-Bit) wichtig?&quot;,&quot;optionen&quot;:[&quot;Sie verhindern, dass Treiber deinstalliert werden&quot;,&quot;Sie garantieren, dass der Treiber von Microsoft validiert wurde und kein Schadcode enthält&quot;,&quot;Sie machen Treiber schneller&quot;,&quot;Sie sind nur für Windows Home relevant&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Signierte Treiber wurden durch Microsoft-Validierung (WHQL) geprüft und garantieren Integrität.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Eine Mitarbeiterin meldet sich: „Seit dem Update gestern Abend funktioniert mein Drucker nicht mehr. Windows hat etwas installiert und seitdem kommt die Fehlermeldung, dass der Treiber nicht kompatibel sei. Ich muss heute dringend Verträge ausdrucken.\&quot;&quot;,&quot;aufgabe&quot;:&quot;1. Wie priorisierst du das Ticket?\n2. Wie gehst du bei der Diagnose vor?\n3. Wie löst du das Problem?\n4. Dokumentiere den Fall für die Wissensdatenbank.&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-3-windows-11&quot;},{&quot;title&quot;:&quot;Modul 4: Troubleshooting-Methodik — Fragen, Eingrenzen, Dokumentieren&quot;,&quot;level&quot;:&quot;1&quot;,&quot;module&quot;:&quot;4&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.comptia.org/content/guides/comptia-a-plus-220-1102-exam-objectives&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.coursera.org/professional-certificates/google-it-support&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.coursera.org/learn/technical-support-fundamentals&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/windows-commands&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;Das Problem nicht richtig identifiziert&quot;,&quot;symptom&quot;:&quot;Du löst ein Problem, das der Nutzer nicht hatte — das eigentliche Problem bleibt bestehen&quot;,&quot;ursache&quot;:&quot;Zu schnelle Hypothesen ohne gründliche Fragestellung; Annahmen statt Fakten&quot;,&quot;diagnose_schritte&quot;:[&quot;Lies das Ticket noch einmal — hat der Nutzer alle Informationen gegeben?&quot;,&quot;Reproduziere das Problem selbst (sofern möglich)&quot;,&quot;Vergleiche: Hast du das beschriebene Symptom oder nur deine Interpretation gesehen?&quot;],&quot;losung&quot;:&quot;- Stelle eine offene Rückfrage: \&quot;Um sicherzugehen: Wenn Sie auf X klicken, erscheint Y — korrekt?\&quot;\n  - Dokumentiere das genaue Symptom in den Worten des Nutzers\n  - Erst dann Theorie aufstellen&quot;,&quot;pravention&quot;:&quot;Niemals mit Schritt 2 beginnen, bevor Schritt 1 (Problem identifizieren) abgeschlossen ist\n\n---&quot;},{&quot;titel&quot;:&quot;Zu viele Änderungen gleichzeitig&quot;,&quot;symptom&quot;:&quot;Nach dem \&quot;Fix\&quot; funktioniert ein anderes Feature nicht mehr&quot;,&quot;ursache&quot;:&quot;Mehrere Lösungen auf einmal angewendet, ohne zu wissen, welche gewirkt hat&quot;,&quot;diagnose_schritte&quot;:[&quot;Liste alle durchgeführten Änderungen chronologisch auf&quot;,&quot;Prüfe, welche Änderung Seiteneffekte haben könnte&quot;,&quot;Mache die letzte Änderung rückgängig und teste&quot;],&quot;losung&quot;:&quot;- Änderungen auf einmal rückgängig machen oder\n  - Systemwiederherstellungs-Punkt nutzen (falls vorhanden)&quot;,&quot;pravention&quot;:&quot;Eine Änderung pro Schritt, testen, dann erst die nächste Änderung\n\n---&quot;},{&quot;titel&quot;:&quot;Die Theorie nicht widerlegt, sondern bestätigt&quot;,&quot;symptom&quot;:&quot;Du verfolgst eine Vermutung, obwohl die Gegentheorie wahrscheinlicher ist&quot;,&quot;ursache&quot;:&quot;Bestätigungsfehler (Confirmation Bias) — du suchst nach Belegen für deine Theorie&quot;,&quot;diagnose_schritte&quot;:[&quot;Formuliere die Gegentheorie explizit: \&quot;Wenn nicht X, dann Y\&quot;&quot;,&quot;Suche aktiv nach Belegen, die deine Theorie widerlegen&quot;,&quot;Wenn alle Befunde zu deiner Theorie passen, aber das Problem bleibt → Theorie war unvollständig&quot;],&quot;losung&quot;:&quot;- Theorie neu aufstellen mit allen gesammelten Befunden\n  - Perspektive wechseln: Was wäre, wenn die Ursache ganz woanders liegt?&quot;,&quot;pravention&quot;:&quot;Die stärkste Theorie testen, die am wenigsten Annahmen benötigt\n\n---&quot;},{&quot;titel&quot;:&quot;Keine Dokumentation der Lösung&quot;,&quot;symptom&quot;:&quot;Das gleine Problem tritt eine Woche später wieder auf — niemand weiss, was gemacht wurde&quot;,&quot;ursache&quot;:&quot;Lösung wurde nur telefonisch kommuniziert, nicht im Ticket dokumentiert&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe, ob die Lösung im Ticket vermerkt ist&quot;,&quot;Prüfe, ob es einen Wissensdatenbank-Eintrag gibt&quot;,&quot;Frage dich: \&quot;Könnte ein Kollege mithilfe der Dokumentation das Problem lösen?\&quot;&quot;],&quot;losung&quot;:&quot;- Ticket nachträglich mit allen Schritten aktualisieren\n  - Wissensdatenbank-Eintrag erstellen\n  - Team-Information (z. B. kurze E-Mail) versenden&quot;,&quot;pravention&quot;:&quot;Dokumentation ist Teil der Lösung, keine Option — erst dann Ticket schliessen\n\n---&quot;}],&quot;quiz&quot;:[{&quot;nummer&quot;:1,&quot;frage&quot;:&quot;Welcher ist der erste Schritt im systematischen Troubleshooting nach CompTIA A+?&quot;,&quot;optionen&quot;:[&quot;Eine Theorie aufstellen&quot;,&quot;Das Problem identifizieren&quot;,&quot;Eine Lösung umsetzen&quot;,&quot;Das System neu starten&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Das Problem identifizieren. Ohne klare Identifizierung löst du unter Umständen das falsche Problem.&quot;},{&quot;nummer&quot;:2,&quot;frage&quot;:&quot;Was ist \&quot;Divide and Conquer\&quot; im Troubleshooting?&quot;,&quot;optionen&quot;:[&quot;Mehrere Techniker an ein Problem setzen&quot;,&quot;Das Problem in kleinere Teilbereiche aufteilen und isolieren&quot;,&quot;Zwei Systeme gegeneinander testen&quot;,&quot;Das System in zwei Partitionen aufteilen&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Das Problem wird in kleinere, testbare Bereiche aufgeteilt, um die Ursache zu isolieren.&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Welche Frage ist eine offene Frage für die erste Diagnose?&quot;,&quot;optionen&quot;:[&quot;\&quot;Ist der Drucker eingeschaltet?\&quot;&quot;,&quot;\&quot;Was genau passieren, wenn Sie auf 'Drucken' klicken?\&quot;&quot;,&quot;\&quot;Haben Sie schon neu gestartet?\&quot;&quot;,&quot;\&quot;Tritt das Problem auf jedem PC auf?\&quot;&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Offene Fragen beginnen mit \&quot;Was\&quot;, \&quot;Wie\&quot;, \&quot;Wann\&quot; und geben dem Nutzer Raum für Beschreibungen.&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Warum solltest du nie mehrere Änderungen gleichzeitig vornehmen?&quot;,&quot;optionen&quot;:[&quot;Weil das zu langsam ist&quot;,&quot;Weil du nicht weisst, welche Änderung gewirkt hat, wenn etwas schiefgeht&quot;,&quot;Weil das System überhitzt&quot;,&quot;Weil das gegen die Lizenzbedingungen verstösst&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Ohne isolierte Änderungen kann die Ursache von Nebenwirkungen nicht bestimmt werden.&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Wann ist ein Problem offiziell als \&quot;gelöst\&quot; zu dokumentieren?&quot;,&quot;optionen&quot;:[&quot;Sobald du die Lösung umgesetzt hast&quot;,&quot;Sobald der Nutzer bestätigt, dass das System wieder voll funktionsfähig ist&quot;,&quot;Sobald du das Ticket geschlossen hast&quot;,&quot;Sobald du eine Theorie aufgestellt hast&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Erst nach Nutzer-Verifizierung und vollständiger Funktion ist das Problem gelöst.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Eine Mitarbeiterin aus der Buchhaltung meldet sich: \&quot;Seit dem Windows-Update gestern Abend startet mein PC viel langsam. Normalerweise geht es in 30 Sekunden, jetzt dauert es über 3 Minuten. Und wenn er endlich startet, ist die Tastatur manchmal 10 Sekunden lang nicht reaktiv.\&quot;&quot;,&quot;aufgabe&quot;:&quot;1. Identifiziere das Problem (Was genau ist das Symptom?)\n2. Stelle 3 gezielte Fragen zur Eingrenzung\n3. Beschreibe 2 Eingrenzungstests (Divide and Conquer)\n4. Welche Tools würdest du nutzen? (Windows 11 23H2)\n5. Dokumentiere den Fall&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-4-troubleshooting&quot;},{&quot;title&quot;:&quot;Modul 5: Netzwerk-Basics — IP, DHCP, DNS, WLAN, ipconfig/ping/tracert&quot;,&quot;level&quot;:&quot;1&quot;,&quot;module&quot;:&quot;5&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.scribd.com/document/943128131/Comptia-a-Plus-220-1101-Exam-Objectives-1-1&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.oreilly.com/library/view/comptia-a-core/9780137637775/ch10.xhtml&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.professormesser.com/free-a-plus-training/220-1101/220-1101-video/220-1101-training-course/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.netacad.az/en/networking-basics/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/training/modules/troubleshoot-premises-hybrid-networking/4-diagnose-ip-configuration-issues&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/troubleshoot/windows-server/networking/trace-route-troubleshoot-tcp-ip-problems&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows-server/networking/dns/troubleshoot/troubleshoot-dns-client&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;APIPA-Adresse (169.254.x.x) — DHCP-Server nicht erreichbar&quot;,&quot;symptom&quot;:&quot;`ipconfig` zeigt `169.254.x.x`, kein Internetzugang&quot;,&quot;ursache&quot;:&quot;DHCP-Server nicht erreichbar (Router aus, Kabel DHCP deaktiviert, Client falsch konfiguriert)&quot;,&quot;diagnose_schritte&quot;:[&quot;`ipconfig /all` — prüfen, ob `DHCP Enabled: Yes` ist&quot;,&quot;`ping <Gateway>` — Router erreichbar?&quot;,&quot;`ipconfig /release` und `ipconfig /renew` — Lease neu anfordern&quot;,&quot;Router-Log prüfen (DHCP aktiviert? IP-Bereich verfügbar?)&quot;],&quot;losung&quot;:&quot;- DHCP am Router aktivieren\n  - `ipconfig /renew` ausführen\n  - Bei statischer Konfiguration: manuell gültige IP, Gateway, DNS eintragen&quot;,&quot;pravention&quot;:&quot;DHCP-Server-Verfügbarkeit überwachen; statische IPs für kritische Geräte mit Reservierung\n\n---&quot;},{&quot;titel&quot;:&quot;Ping funktioniert, aber Browser zeigt \&quot;Keine Verbindung\&quot;&quot;,&quot;symptom&quot;:&quot;`ping 8.8.8.8` funktioniert, aber Webseiten laden nicht&quot;,&quot;ursache&quot;:&quot;DNS-Auflösung fehlgeschlagen, Proxy falsch konfiguriert, oder Blockade auf Anwendungsebene&quot;,&quot;diagnose_schritte&quot;:[&quot;`ping www.example.com` — funktioniert DNS?&quot;,&quot;`nslookup www.example.com` — manuelle DNS-Abfrage testen&quot;,&quot;`ipconfig /all` — DNS-Server korrekt?&quot;,&quot;`ipconfig /flushdns` — Cache leeren&quot;,&quot;`netsh winhttp show proxy` — Proxy-Einstellung prüfen&quot;],&quot;losung&quot;:&quot;- DNS-Server manuell setzen (z. B. 8.8.8.8 / 1.1.1.1)\n  - `ipconfig /flushdns` ausführen\n  - Proxy-Einstellungen in Windows zurücksetzen&quot;,&quot;pravention&quot;:&quot;DNS-Server-Redundanz (primär + sekundär), regelmäßige Cache-Pflege\n\n---&quot;},{&quot;titel&quot;:&quot;Ping schlägt fehl, obwohl Verbunden-Anzeige&quot;,&quot;symptom&quot;:&quot;WLAN zeigt \&quot;Verbunden\&quot;, aber `ping <Gateway>` schlägt fehl&quot;,&quot;ursache&quot;:&quot;Falsche Subnetzmaske/Gateway, IP-Konflikt, oder Adapter deaktiviert&quot;,&quot;diagnose_schritte&quot;:[&quot;`ipconfig /all` — IP, Subnetzmaske, Gateway prüfen&quot;,&quot;`ping <eigene IP>` — Adapter funktioniert?&quot;,&quot;`arp -a` — MAC-Adresse des Gateways sichtbar?&quot;,&quot;`netsh interface show interface` — Adapter-Status&quot;],&quot;losung&quot;:&quot;- Adapter deaktivieren/aktivieren\n  - `netsh int ip reset` und `netsh winsock reset` (als Admin)\n  - IP-Konflikt: `ipconfig /release` → Router-Neustart → `ipconfig /renew`&quot;,&quot;pravention&quot;:&quot;Reservierungen für statische Geräte, IP-Adressmanagement dokumentieren\n\n---&quot;},{&quot;titel&quot;:&quot;tracert stoppt früh — Router blockiert ICMP&quot;,&quot;symptom&quot;:&quot;`tracert` zeigt nur 1–2 Hops, dann `* * *`, Ziel ist aber erreichbar&quot;,&quot;ursache&quot;:&quot;Zwischen-Router blockiert ICMP (häufig aus Sicherheitsgründen), oder Firewall&quot;,&quot;diagnose_schritte&quot;:[&quot;`ping <Ziel>` — ist das Ziel per Ping erreichbar?&quot;,&quot;`tracert -d` — ohne DNS-Lookup erneut versuchen&quot;,&quot;Vergleich: anderes Gerät im selben Netzwerk&quot;,&quot;`pathping <Ziel>` — alternative Tool (kombiniert ping + tracert)&quot;],&quot;losung&quot;:&quot;- Nicht als Fehler werten, wenn Ping und Anwendung funktionieren\n  - `pathping` verwenden für detailliertere Analyse\n  - Port-basierte Tests (z. B. `telnet <host> 80`) als Alternative&quot;,&quot;pravention&quot;:&quot;ICMP-Blockade ist legitime Sicherheitsmaßnahme; auf Alternativen zurückgreifen\n\n---&quot;}],&quot;quiz&quot;:[{&quot;nummer&quot;:1,&quot;frage&quot;:&quot;Was bedeutet es, wenn `ipconfig` die IP-Adresse `169.254.10.50` anzeigt?&quot;,&quot;optionen&quot;:[&quot;Der DHCP-Server hat diese Adresse vergeben&quot;,&quot;Windows hat eine APIPA-Adresse vergeben, weil kein DHCP-Server erreichbar war&quot;,&quot;Der Computer hat eine statische IP erhalten&quot;,&quot;Die Subnetzmaske ist falsch konfiguriert&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;APIPA (Automatic Private IP Addressing) im Bereich 169.254.0.0/16 zeigt einen DHCP-Fehler an.&quot;},{&quot;nummer&quot;:2,&quot;frage&quot;:&quot;Welcher DNS-Datensatztyp wird verwendet, um eine Domain einer IPv4-Adresse zuzuordnen?&quot;,&quot;optionen&quot;:[&quot;AAAA&quot;,&quot;MX&quot;,&quot;A&quot;,&quot;TXT&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;der A-Record (Address) mappt eine Domain auf eine IPv4-Adresse.&quot;},{&quot;nummer&quot;:3,&quot;frage&quot;:&quot;Ein Benutzer meldet: \&quot;Mein WLAN zeigt 'Verbunden', aber ich kann keine Webseiten öffnen. `ping 8.8.8.8` funktioniert.\&quot; Was ist die wahrscheinlichste Ursache?&quot;,&quot;optionen&quot;:[&quot;Defektes WLAN-Kabel&quot;,&quot;DNS-Auflösung fehlgeschlagen&quot;,&quot;Der WLAN-Treiber ist veraltet&quot;,&quot;Der Router hat keinen Strom&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Ping auf IP-Ebene funktioniert, aber Domain-Auflösung schlägt fehl → DNS-Problem.&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Welcher Befehl zeigt die aktuelle TCP/IP-Konfiguration samt MAC-Adresse und DHCP-Server an?&quot;,&quot;optionen&quot;:[&quot;`ping /all`&quot;,&quot;`tracert /all`&quot;,&quot;`ipconfig /all`&quot;,&quot;`netstat /all`&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;`ipconfig /all` zeigt die vollständige Konfiguration aller Netzwerkadapter.&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Was zeigt der Befehl `tracert`?&quot;,&quot;optionen&quot;:[&quot;Die IP-Adresse des lokalen Computers&quot;,&quot;Den Weg (Hops/Router) zu einem Ziel und die Latenzzeit&quot;,&quot;Den Inhalt des DNS-Caches&quot;,&quot;Die physische Netzwerktopologie&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;tracert (Trace Route) zeigt jeden Router auf dem Weg zum Ziel.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Ein Mitarbeiter aus dem Marketing meldet sich: \&quot;Seit dem Umzug in den neuen Raum habe ich kein Internet mehr. Das WLAN zeigt 'Verbunden', aber alle Webseiten zeigen 'Keine Verbindung zum Internet'. Meine Kollegen im selben Raum haben kein Problem.\&quot;&quot;,&quot;aufgabe&quot;:&quot;1. Was ist die Priorität dieses Tickets?\n2. Wie gehst du bei der Diagnose vor? (Nutze die Bottom-up-Methode)\n3. Was ist die wahrscheinlichste Ursache und wie löst du sie?\n4. Dokumentiere den Fall für die Wissensdatenbank.&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-5-netzwerk-basics&quot;},{&quot;title&quot;:&quot;Modul 6: Microsoft 365 — Outlook, Teams Basics, Passwort-Resets&quot;,&quot;level&quot;:&quot;1&quot;,&quot;module&quot;:&quot;6&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/training/paths/describe-microsoft-365-core-services-concepts/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/microsoft-365/admin/setup/setup-outlook?view=o365-worldwide&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/microsoftteams/teams-overview&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/microsoftteams/teams-channels-overview&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/microsoft-365/admin/add-users/reset-passwords?view=o365-worldwide&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/microsoft-365/admin/add-users/let-users-reset-passwords?view=o365-worldwide&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.comptia.org/en-us/blog/how-to-study-for-comptia-a/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;Administrator hat keine passende Rolle für Passwort-Reset&quot;,&quot;symptom&quot;:&quot;Administrator-Konto meldet „Nicht autorisiert\&quot;, obwohl es ein Admin-Konto ist&quot;,&quot;ursache&quot;:&quot;Nicht jeder Administrator hat automatisch das Recht, Passwörter zurückzusetzen. Nur spezifische Rollen wie Password Administrator oder Global Administrator dürfen Passwörter zurücksetzen.&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe im Microsoft 365 Admin Center unter **Benutzer** > **Aktive Benutzer** die zugewiesene Rolle&quot;,&quot;Vergleiche mit der Rollen-Tabelle in Abschnitt 4&quot;,&quot;Prüfe, ob die Rolle die Berechtigung „Passwort zurücksetzen\&quot; enthält&quot;],&quot;losung&quot;:&quot;- Weise dem Administrator die Rolle „Password Administrator\&quot; zu\n  - Alternativ: Lass das Passwort von einem Global Administrator zurücksetzen&quot;,&quot;pravention&quot;:&quot;Dokumentiere, welche Rollen welche Berechtigungen haben. Verweise auf die Microsoft Learn-Dokumentation zur Rollenverteilung.\n\n---&quot;},{&quot;titel&quot;:&quot;SSPR funktioniert nicht für Benutzer&quot;,&quot;symptom&quot;:&quot;Benutzer können ihr Passwort nicht selbst zurücksetzen, obwohl SSPR aktiviert ist&quot;,&quot;ursache&quot;:&quot;SSPR ist nicht für alle Benutzer aktiviert oder es fehlt eine Authentifizierungsmethode&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe im Microsoft Entra Admin Center, ob SSPR auf „Alle\&quot; oder „Ausgewählt\&quot; gestellt ist&quot;,&quot;Prüfe, ob die Benutzer in der ausgewählten Gruppe enthalten sind&quot;,&quot;Prüfe, ob für die Benutzer eine Authentifizierungsmethode (E-Mail, Telefon) konfiguriert ist&quot;],&quot;losung&quot;:&quot;- Aktiviere SSPR für alle Benutzer oder füge die betroffenen Benutzer der Gruppe hinzu\n  - Weise eine Authentifizierungsmethode zu (z. B. E-Mail oder Mobiltelefonnummer)&quot;,&quot;pravention&quot;:&quot;SSPR bei der Einführung direkt für alle Benutzer aktivieren und Authentifizierungsmethoden im Onboarding-ProzessPflicht machen.\n\n---&quot;},{&quot;titel&quot;:&quot;Outlook fragt nach Passwort-Reset weiterhin nach Passwort&quot;,&quot;symptom&quot;:&quot;Nach erfolgreichem Passwort-Reset fragt Outlook wiederholt nach dem Passwort, auch wenn es korrekt eingegeben wird&quot;,&quot;ursache&quot;:&quot;Der Windows Credential Manager speichert die alten Anmeldeinformationen&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe, ob der Benutzer im Active Directory das korrekte Passwort hat&quot;,&quot;Öffne den Credential Manager (Systemsteuerung > Benutzerkonten > Credential Manager)&quot;,&quot;Suche nach Einträgen, die auf Outlook/Exchange verweisen&quot;],&quot;losung&quot;:&quot;- Credential Manager öffnen und die betroffenen Einträge entfernen\n  - Outlook neu starten — es sollte nach dem neuen Passwort fragen&quot;,&quot;pravention&quot;:&quot;Schulung für Benutzer: Nach Passwortänderung auch Credential Manager prüfen. Alternative: Gruppenrichtlinie zur automatischen Aktualisierung konfigurieren.\n\n---&quot;},{&quot;titel&quot;:&quot;Teams-Kanäle falsch angelegt&quot;,&quot;symptom&quot;:&quot;Benutzer können Dateien nicht teilen oder haben zu viel/zugriff auf vertrauliche Kanäle&quot;,&quot;ursache&quot;:&quot;Falsche Kanal-Typen (Standard vs. Privat) oder fehlende Verständnis der Sichtbarkeitsregeln&quot;,& chtige Ort.&quot;},{&quot;nummer&quot;:4,&quot;frage&quot;:&quot;Was bedeutet SSPR?&quot;,&quot;optionen&quot;:[&quot;Secure System Password Recovery&quot;,&quot;Self-Service Password Reset&quot;,&quot;Single Sign-On Password Reset&quot;,&quot;System Service Protection Reset&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Self-Service Password Reset. Benutzer können ihr Passwort selbst zurücksetzen.&quot;},{&quot;nummer&quot;:5,&quot;frage&quot;:&quot;Warum kann Outlook nach einer Passwortänderung weiterhin das alte Passwort verlangen?&quot;,&quot;optionen&quot;:[&quot;Outlook ist defekt&quot;,&quot;Der Credential Manager speichert alte Anmeldeinformationen&quot;,&quot;Der E-Mail-Server ist offline&quot;,&quot;Das Konto wurde gelöscht&quot;],&quot;antwort&quot;:1,&quot;erklaerung&quot;:&quot;Der Windows Credential Manager speichert die alten Anmeldeinformationen.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Ein Mitarbeiter meldet sich bei dir: „Ich habe gestern mein Passwort geändert, seitdem funktioniert Outlook nicht mehr. Ich bekomme ständig eine Aufforderung, mein Passwort einzugeben, aber wenn ich es eingebe, erscheint wieder die Fehlermeldung. Ich muss dringend E-Mails beantworten. Außerdem muss ich für ein neues Projekt ein Team in Microsoft Teams erstellen — wie geht das?\&quot;&quot;,&quot;aufgabe&quot;:&quot;1. Priorisiere das Ticket\n2. Diagnose das Outlook-Problem\n3. Löse das Problem\n4. Erkläre, wie der Benutzer ein neues Team in Microsoft Teams erstellt\n5. Dokumentiere den Fall für die Wissensdatenbank&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-6-m365&quot;},{&quot;title&quot;:&quot;Modul 7: Sicherheit Basics — Defender, Phishing, MFA, Fernwartung&quot;,&quot;level&quot;:&quot;1&quot;,&quot;module&quot;:&quot;7&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://www.comptia.org/en-us/blog/how-to-study-for-comptia-a/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows/security/operating-system-security/system-security/windows-defender-security-center/windows-defender-security-center&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/defender-endpoint/microsoft-defender-security-center-antivirus&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/training/modules/securing-you-basics-beyond/2-phishing&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/remotepc/remote-desktop-allow-access&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows/security/operating-system-security/system-security/windows-defender-security-center/wdsc-firewall-network-protection&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;Echtzeit-Schutz deaktiviert&quot;,&quot;symptom&quot;:&quot;Viren werden nicht erkannt, System wird infiziert&quot;,&quot;ursache&quot;:&quot;Echtzeit-Schutz wurde manuell deaktiviert oder durch Drittanbieter-Antivirus&quot;,&quot;diagnose_schritte&quot;:[&quot;Windows Security → Virus &amp; threat protection → Einstellungen verwalten&quot;,&quot;Prüfen, ob \&quot;Echtzeit-Schutz\&quot; aktiviert ist&quot;,&quot;Prüfen, ob ein Drittanbieter-Antivirus installiert ist&quot;],&quot;losung&quot;:&quot;- Echtzeit-Schutz wieder aktivieren\n  - Drittanbieger-Antivirus deinstallieren oder konfigurieren&quot;,&quot;pravention&quot;:&quot;Echtzeit-Schutz nie dauerhaft deaktivieren; bei Problemen temporär deaktivieren und danach sofort wieder aktivieren\n\n---&quot;},{&quot;titel&quot;:&quot;Phishing-E-Mail angeklickt&quot;,&quot;symptom&quot;:&quot;Benutzer hat llegen weiterleiten&quot;,&quot;Nicht klicken, die E-Mail melden und löschen&quot;,&quot;Die E-Mail ignorieren und nichts tun&quot;],&quot;antwort&quot;:2,&quot;erklaerung&quot;:&quot;Nicht klicken, melden und löschen.&quot;}],&quot;ticket&quot;:[{&quot;situation&quot;:&quot;Ein Mitarbeiter meldet sich: \&quot;Ich habe heute Morgen eine E-Mail erhalten, die aussieht, als wäre sie von unserer IT-Abteilung. Darin stand, dass mein Passwort abgelaufen ist und ich es über einen Link ändern muss. Ich habe auf den Link geklickt und meine Daten eingegeben. Jetzt habe ich Angst, dass mein Konto kompromittiert ist.\&quot;&quot;,&quot;aufgabe&quot;:&quot;1. Was ist die Priorität dieses Tickets?\n2. Wie gehst du bei der Diagnose vor?\n3. Wie löst du das Problem?\n4. Dokumentiere den Fall für die Wissensdatenbank.&quot;,&quot;lösung&quot;:&quot;(aufklappbar)&quot;}],&quot;slug&quot;:&quot;modul-7-sicherheit&quot;},{&quot;title&quot;:&quot;Modul 8: Remote-Support-Tools und Benutzer-Kommunikation&quot;,&quot;level&quot;:&quot;1&quot;,&quot;module&quot;:&quot;8&quot;,&quot;last_verified&quot;:&quot;2026-10-19&quot;,&quot;windows_version&quot;:&quot;Windows 11 23H2&quot;,&quot;sources&quot;:[{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/clients/remote-desktop-clients&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/windows/win32/termserv/remote-desktop-protocol&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://www.comptia.org/content/guides/comptia-a-220-1102-exam-objectives&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;},{&quot;url&quot;:&quot;https://learn.microsoft.com/en-us/training/modules/introduction-to-remote-desktop/&quot;,&quot;abrufdatum&quot;:&quot;2026-10-19&quot;}],&quot;fehler&quot;:[{&quot;titel&quot;:&quot;RDP ohne Network Level Authentication (NLA)&quot;,&quot;symptom&quot;:&quot;Unbefugte Personen können auf den Remote-PC zugreifen&quot;,&quot;ursache&quot;:&quot;NLA wurde deaktiviert, sodass die Authentifizierung erst nach der Verbindung erfolgt&quot;,&quot;diagnose_schritte&quot;:[&quot;Öffne Systemsteuerung → System → Remotedesktop&quot;,&quot;Prüfe, ob \&quot;Verbindungen nur von Computern mit Remotedesktop mit Network Level Authentication zulassen\&quot; aktiviert ist&quot;,&quot;Prüfe die Windows-Firewall-Regeln für RDP (Port 3389)&quot;],&quot;losung&quot;:&quot;- NLA aktivieren (Systemsteuerung → System → Remotedesktop → Erweiterte Einstellungen)\n  - RDP-Zugriff auf ein Minimum von Benutzern beschränken\n  - VPN oder RD-Gateway für externe Zugriffe verwenden&quot;,&quot;pravention&quot;:&quot;NLA immer aktivieren, RDP nie direkt aus dem Internet zugänglichstellen\n\n---&quot;},{&quot;titel&quot;:&quot;Remote-Support-Tool ohne Zustimmung des Benutzers&quot;,&quot;symptom&quot;:&quot;Benutzer fühlt sich überwacht oder ausgeraubt&quot;,&quot;ursache&quot;:&quot;Remote-Zugriff wurde ohne ausdrückliche Zustimmung oder ohne klare Kommunikation durchgeführt&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe, ob der Benutzer den Zugriff ausdrücklich bestätigt hat&quot;,&quot;Prüfe, ob der Benutzer verstanden hat, was bedeutet&quot;,&quot;Prüfe, ob die Sitzung dokumentiert wurde&quot;],&quot;losung&quot;:&quot;- Sitzung beenden und den Benutzer um Entschuldigung bitten\n  - Klare Erklärung des Zwecks der Sitzung geben\n  - Zustimmung schriftlich oder im Ticket dokumentieren&quot;,&quot;pravention&quot;:&quot;Immer vor der Sitzung erklären, was passiert, und Zustimmung einholen\n\n---&quot;},{&quot;titel&quot;:&quot;Unverschlüsselte oder unsichere Verbindung&quot;,&quot;symptom&quot;:&quot;Daten können abgehört werden, Verbindung wird getrennt&quot;,&quot;ursache&quot;:&quot;Veraltete RDP-Version, keine TLS-Verschlüsselung, oder unsicheres Netzwerk&quot;,&quot;diagnose_schritte&quot;:[&quot;Prüfe die RDP-Version (Windows 10/11 verwenden standardmäßig TLS 1.2+)&quot;,&quot;P
